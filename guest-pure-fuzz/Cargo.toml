# Zero-drift verification of the guest's PURE-Rust consensus helpers. build.rs extracts the real
# functions from prover/methods/guest/src/main.rs at compile time (no copy-paste), and the tests
# check them against independent references grounded in canonical Bitcoin mainnet values.
[package]
name = "guest-pure-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

# For the guest utreexo tests (hazync#76). The guest module is INCLUDED BY PATH, never copied — the
# same zero-drift rule build.rs follows for main.rs — so these tests cannot pass against a stale copy.
# sha2 matches the guest's hasher; hazync-utreexo is the reference the guest is checked against.
[dev-dependencies]
sha2 = "0.10"
hazync-utreexo = { path = "../accumulator" }
# The AUTHORITY for the lax DER differential (hazync#139). `from_der_lax` in this crate is a port
# of the very function the guest parser transcribes, so it is the right thing to be checked against
# — not a reimplementation of our own, which would only prove we made the same mistake twice.
secp256k1 = { version = "0.29", features = ["rand-std"] }
rand = "0.8"

