<!doctype html>
<!--
  The public live page: hazync.org/live/

  Serves two files written by publish.sh next to it — frame.png and meta.json.

  ⛔ A STALE FRAME LOOKS EXACTLY LIKE A LIVE ONE. The frame has a timestamp drawn into it, but a
     viewer reads that as "now" unless something says otherwise. If the renderer or the publisher
     dies, the last frame sits here indefinitely showing a fleet that stopped hours ago. meta.json
     carries the render time and this page goes visibly stale against it.

  ⛔ THE SCRIPT IS EXTERNAL BECAUSE hazync.org SENDS script-src 'self' WITH NO 'unsafe-inline'.
     An inline script element here is silently blocked by the browser: the page renders, the styling is
     fine (style-src DOES allow inline), and the only symptom is a status stuck on "connecting…"
     beside a broken image, because nothing ever ran. Keep the JS in live.js.

  ⛔ THE FRAME MUST NOT BE CACHED. It changes every second at the same URL, so every request carries
     a cache-buster; without one the page shows one frame for ever and looks frozen rather than
     broken.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazync Live</title>
<style>
  :root {
    --bg: #141414; --fg: #e8e8e8; --dim: #8a8a8a; --line: #2a2a2a;
    --warn: #e08c3c; --bad: #d4553f; --ok: #5ac46e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }

  /* THE WHOLE PAGE FITS THE VIEWPORT. The frame is 16:9 and dense: scrolling to see the bottom of
     one picture is the wrong shape for a glanceable dashboard. body is a flex COLUMN in which the
     header and footer size to their content and the frame takes whatever is left -- `min-height: 0`
     on that row is what actually lets it shrink, since a flex item's default min-height is auto and
     would otherwise hold the image at full size and push the footer off the screen. */
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    height: 100vh; height: 100dvh;          /* dvh so mobile browser chrome does not cause a scroll */
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 16px; overflow: hidden;
  }
  header { flex: 0 0 auto; width: 100%; max-width: 1920px; display: flex; flex-wrap: wrap;
           align-items: baseline; gap: 12px; margin-bottom: 8px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .04em; }
  .sp { flex: 1 1 auto; }
  #status { font-size: 13px; color: var(--dim); }
  #status.live { color: var(--ok); }
  #status.stale { color: var(--warn); }
  #status.dead { color: var(--bad); }
  .frame-wrap { flex: 1 1 auto; min-height: 0;
                width: 100%; max-width: 1920px; position: relative;
                display: flex; align-items: center; justify-content: center;
                border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
                background: #0e0e0e; }
  /* contain, so the frame is never cropped and never distorted whatever the window's aspect */
  img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
        object-fit: contain; }
  #banner { display: none; position: absolute; left: 0; right: 0; top: 0;
            padding: 8px 14px; font-size: 13px; text-align: center;
            background: rgba(20,20,20,.94); border-bottom: 1px solid var(--line); }
  #banner.show { display: block; }
  #banner.stale { color: var(--warn); }
  #banner.dead  { color: var(--bad); }
  button {
    font: inherit; font-size: 13px; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  /* Kept out of the flex flow so a message never resizes the frame: the picture must not jump
     because a line of text appeared under it. */
  #sharemsg {
    position: absolute; left: 16px; bottom: 6px; margin: 0;
    font-size: 12px; color: var(--dim); min-height: 1em;
  }
  footer { flex: 0 0 auto; width: 100%; max-width: 1920px; margin-top: 8px;
           font-size: 12px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  a { color: inherit; }

  /* ⚠ ON A PHONE, FITTING WINS NOTHING. A 1920x1080 dashboard scaled to 380px is unreadable at any
     height, so below this width the page stops fitting and scrolls normally -- a readable picture
     you scroll beats an unreadable one you do not. */
  @media (max-width: 700px) {
    body { height: auto; min-height: 100vh; overflow: visible; }
    .frame-wrap { flex: 0 0 auto; }
    img { max-height: none; width: 100%; }
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fbfbfb; --fg: #1a1a1a; --dim: #666; --line: #ddd;
    }
    :root:not([data-theme="dark"]) .frame-wrap { background: #f0f0f0; }
    :root:not([data-theme="dark"]) #banner { background: rgba(255,255,255,.94); }
  }
</style>
</head>
<body>

<header>
  <h1>HAZYNC &mdash; zkVM bitcoin block proofs, live</h1>
  <span class="sp"></span>
  <span id="status">connecting&hellip;</span>
  <button id="share" type="button" aria-label="Share this view">Share</button>
</header>
<p id="sharemsg" role="status" aria-live="polite"></p>

<div class="frame-wrap">
  <div id="banner"></div>
  <img id="frame" alt="Live view of the Hazync proving fleet">
</div>

<footer>
  <span>GPU power measured at 1&nbsp;Hz on each card.</span>
  <span>Segment progress parsed from the worker's own output.</span>
  <span id="rendered"></span>
</footer>

<script src="live.js"></script>
</body>
</html>
