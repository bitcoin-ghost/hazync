name: publish-deps-image

# ⛔ WHY A WORKFLOW AND NOT A LAPTOP. Publishing the deps image used to mean a human holding a
# personal access token with write:packages, logged in to ghcr on a machine somewhere. That token
# expires, leaks, or lives on one person's laptop — and on 2026-09-27 the stored one had gone stale
# and could not even PULL, which is worse than no login at all.
#
# A workflow's GITHUB_TOKEN is minted when the job starts, scoped to this repository, and dies with
# the job. `packages: write` lets it push to ghcr.io/hazync/* because hazync owns this repo.
#
# ⚠ The SOURCE is public, so the pull needs no credential at all: only the push does.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Image to copy FROM (must be publicly readable)"
        default: ghcr.io/bitcoin-ghost/hazync-deps
      tags:
        description: "Space-separated tags to copy"
        default: e2226e81bd91dd30 0a54d2b21b96dc86

permissions:
  contents: read
  packages: write        # the only reason this workflow can push

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr as this run
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ imagetools copies SERVER SIDE. It never downloads the layers, so a multi-gigabyte image
      # costs seconds and no runner disk. It also preserves the OCI index — the amd64 manifest AND
      # the buildx attestation beside it — which a pull/tag/push would flatten.
      # ⛔ EVERY INPUT COMES THROUGH env, NOT THROUGH ${{ }} INSIDE THE SCRIPT. GitHub substitutes an
      # expression into the run block as TEXT before bash ever sees it, so a crafted input is
      # arbitrary code in a runner that holds packages:write, in the repository that holds the
      # signing key. The repo's own workflow check refuses it, and caught this on the first try.
      - name: Copy each tag
        env:
          TAGS: ${{ inputs.tags }}
          SOURCE: ${{ inputs.source }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          fail=0
          for t in $TAGS; do
            echo "::group::$t"
            if docker buildx imagetools create --tag "ghcr.io/$OWNER/hazync-deps:$t" "$SOURCE:$t"; then
              echo "copied $t"
            else
              echo "::error::failed to copy $t"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # ⛔ VERIFY BY DIGEST, NOT BY "the push did not error". A copy that lands a different digest is
      # a different image, and the whole point of this one is that reproduce/ can name it exactly.
      - name: Check each copy matches the source digest
        env:
          TAGS: ${{ inputs.tags }}
          SOURCE: ${{ inputs.source }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          fail=0
          for t in $TAGS; do
            a=$(docker buildx imagetools inspect "$SOURCE:$t" --format '{{.Manifest.Digest}}')
            b=$(docker buildx imagetools inspect "ghcr.io/$OWNER/hazync-deps:$t" --format '{{.Manifest.Digest}}')
            if [ "$a" = "$b" ]; then
              echo "ok   $t  $a"
            else
              echo "::error::$t digest differs — source $a, copy $b"; fail=1
            fi
          done
          exit $fail

      # ⛔⛔ A PRIVATE COPY PASSES EVERY CHECK ABOVE AND IS USELESS. Measured 2026-09-27: the first run
      # of this workflow copied both tags, verified both digests, and exited 0 -- and ghcr.io created
      # ghcr.io/hazync/hazync-deps as a PRIVATE package, so `curl ghcr.io/token?scope=...:pull`
      # returned no token at all and nobody outside the org could pull it. The whole point of this
      # image is that `reproduce/` can name it and anyone can fetch it WITHOUT a credential, which is
      # exactly the one property neither step above tests: both ran as a logged-in runner.
      #
      # ⚠ THIS STEP MUST USE NO CREDENTIAL. Reaching for the runner's token here would make it pass
      # for the same reason the others do.
      # ⚠ Visibility cannot be set from a workflow token. A first publish has to be flipped once, by
      # hand, at https://github.com/orgs/<owner>/packages/container/hazync-deps/settings -- so this
      # step's job is to REFUSE to call the publish done until that has happened.
      - name: Anyone can pull it without a credential
        env:
          TAGS: ${{ inputs.tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          fail=0
          for t in $TAGS; do
            tok=$(curl -sS --max-time 20 \
                  "https://ghcr.io/token?scope=repository:$OWNER/hazync-deps:pull&service=ghcr.io" \
                  | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
            if [ -z "$tok" ]; then
              echo "::error::ghcr granted NO anonymous pull token for $OWNER/hazync-deps — the package is PRIVATE. Flip it to public at https://github.com/orgs/$OWNER/packages/container/hazync-deps/settings then re-run."
              fail=1; break
            fi
            code=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer $tok" \
                   -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                   "https://ghcr.io/v2/$OWNER/hazync-deps/manifests/$t")
            if [ "$code" = 200 ]; then
              echo "ok   $t is anonymously pullable (HTTP $code)"
            else
              echo "::error::$t is not anonymously pullable (HTTP $code)"; fail=1
            fi
          done
          exit $fail
