name: adversarial

# Builds the real prover (Bitcoin Core consensus code -> riscv32 guest) and runs the self-contained
# soundness checks on every push: the block-170 consensus regression and the adversarial suite, which
# asserts that a witness exploiting each known hole (host-controlled height, in-block double-spend /
# ordering, malformed coinbase) is REJECTED, alongside an honest baseline that must be accepted.

# `push:` was unqualified, so every branch with an open PR ran the whole suite TWICE — once for the
# push and once for the pull_request. soundness-suite is a 45+ minute job, so on a night with five
# PRs open that was five wasted hours of runner time and a queue nothing could get through.
#
# Now: branches are covered by `pull_request`, and `main` by `push` — which still matters, because
# some jobs only ever run on main and a green PR is not a green main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The heavy boundary set (#83) is ~34 minutes of execution over blocks that never change, so it runs
  # nightly rather than per push. It still runs: a boundary nobody executes is the gap #83 was filed for.
  schedule:
    - cron: '0 3 * * *'

# Superseding a branch makes its in-flight run pointless; let it be cancelled rather than sit in the
# queue ahead of the run that matters. NOT applied to main: those runs are the record of what the
# released tree actually does, and cancelling one leaves a commit with no verdict.
#
# `cancel-in-progress: false` alone did NOT achieve that, and the comment above used to claim it did
# (hazync#155). It protects the run that is already EXECUTING; it does not protect one QUEUED behind
# it, because GitHub cancels previously-pending runs in a group when a newer one arrives. Pushing
# three commits to main in quick succession gave verdicts to the first and the last and cancelled the
# middle -- observed on b878503/3f958e8/2d9a636, and on three earlier main commits.
#
# That is exactly the failure this exemption exists to prevent, and it is quiet: a release can be cut
# from a tree whose own commit never ran, because release.sh checks HEAD and HEAD is usually the
# newest push. So main commits now get a group PER SHA and never queue behind each other. Branches
# keep the shared group and keep cancelling, which is where the runner time actually matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  accumulator-tests:
    # Fast, always-green: the pure-Rust Utreexo accumulator (single-delete vs a full-forest oracle).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed by check-versions.sh to compare the documented "current release" against the
          # newest tag. The default shallow checkout has none, and the check would silently skip.
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - name: Utreexo accumulator tests
        run: cargo test --manifest-path accumulator/Cargo.toml --release
      - name: Guest pure-Rust tests (activation heights, add256, median_time_past, utreexo SEC-2 pinning)
        run: cargo test --manifest-path guest-pure-fuzz/Cargo.toml --release
      - name: Coinbase SMT (BIP30 non-membership) — incl. differential oracle
        # A SECOND accumulator, so it gets the same discipline as the first from day one rather than
        # after an audit asks: the optimised tree is checked against a deliberately naive one that
        # shares no code, over a random walk of inserts/deletes/decrements. The optimised version
        # prunes empty subtrees to constants and proves by descending sorted slices — exactly the kind
        # of cleverness that yields a self-consistent WRONG answer. The first bug here was precisely
        # that: reversed sibling order folding to a well-formed but incorrect root.
        run: cargo test --manifest-path coinbase-smt/Cargo.toml --release
      - name: Coinbase SMT still builds no_std for the GUEST target
        # The whole point of the crate being shared rather than ported is that the guest compiles the
        # SAME code the host does. That only holds while the roots-only half stays std-free, and
        # nothing stops someone reaching for a HashMap in a helper — it would build fine here and fail
        # only inside the zkVM build, far from the cause. So it is checked directly, against the real
        # bare-metal target.
        run: |
          rustup target add riscv32im-unknown-none-elf
          cargo build --release --manifest-path coinbase-smt/Cargo.toml \
                --no-default-features --target riscv32im-unknown-none-elf
      - name: Genesis-anchor pin, including the empty coinbase-SMT root
        # `is_genesis_anchored` is the assertion the whole artifact rests on. #54 added a field to it,
        # and a range that anchors at genesis while starting from a FABRICATED coinbase-SMT would
        # otherwise verify happily against a history that never happened.
        run: cargo test --manifest-path rangestate/Cargo.toml --release
      - name: Coinbase SMT no_std build for the GUEST target, WITH serde
        # `Proof` crosses the wire, so its serde impls have to build for bare metal too — the guest
        # deserialises the same type the bridge serialises. The default no_std check above does not
        # cover it, since serde is off by default.
        run: |
          cargo build --release --manifest-path coinbase-smt/Cargo.toml \
                --no-default-features --features serde --target riscv32im-unknown-none-elf
      - name: Accumulator fuzz-harness unit tests
        run: cargo test --manifest-path audit-fuzz/Cargo.toml --release
      - name: Coordinator seam fuzz (soundness — must find NOTHING)
        run: cd coordinator && python3 seam_fuzz.py 20000
      - name: Coordinator seam fuzz POSITIVE CONTROL (H9 guard removed — must find SOMETHING)
        # Exits 1 when it finds nothing: that state means the harness has gone blind and every clean
        # run above is meaningless. A fuzzer is only evidence while its control still fires.
        run: cd coordinator && python3 seam_fuzz.py --control
      - name: Coordinator input-handler fuzz (parse_range / clean_handle / is_hex)
        run: cd coordinator && python3 parse_fuzz.py 30000
      - name: SIGUSR1 dumps every thread and the coordinator keeps serving (#265)
        # The only evidence of why a wedged coordinator is wedged, taken BEFORE the restart.
        run: cd coordinator && python3 test_stack_dump.py
      - name: Stack dump POSITIVE CONTROL (hook not installed — must FAIL)
        run: |
          cd coordinator
          python3 test_stack_dump.py --control
      - name: Spine + fold logic (#30, #37)
        # foldable() pair selection, the range-id grammar, and the spine's store/monotonic/serve path.
        # NOT covered, deliberately and stated in the script: real STARK verification (needs the
        # 184 MB host binary) and actual folding (a prove op; CI has no GPU). Those are verified by
        # hand against real board receipts under prover/evidence/.
        run: cd coordinator && python3 test_spine_fold.py
      - name: Spine + fold POSITIVE CONTROL (already-folded check removed — must FAIL)
        run: |
          cd coordinator
          python3 test_spine_fold.py --control
      - name: Fold claims (#333)
        # POST /api/foldclaim grants, conflicts, caps, expires and releases; /api/foldable offers 32 and hides claimed
        # pairs; only keys with proven work may claim; a valid fold is accepted from anyone; the board shows the
        # claims; and the worker folds unclaimed whenever it cannot get a claim.
        run: cd coordinator && python3 test_fold_claims.py
      - name: Fold claims POSITIVE CONTROL (claims ignored, as before #333 — must FAIL)
        run: |
          cd coordinator
          python3 test_fold_claims.py --control
      - name: A lost claim response orphans no block (#268)
        # The real worker against the real handler, with the first claim's response dropped after the
        # server committed it. The retry must get the same block back, not orphan it for an hour.
        run: cd coordinator && python3 test_claim_nonce.py
      - name: Claim nonce POSITIVE CONTROL (worker sends no nonce — must FAIL)
        run: |
          cd coordinator
          python3 test_claim_nonce.py --control
      - name: Heartbeat rejection log (bip-448, 2026-09-11)
        # Drives the real HTTP handler: every rejected /api/beat must be logged with the caller, the
        # reason, and -- for a 409 -- what the DB really holds for that range.
        run: cd coordinator && python3 test_beat_log.py
      - name: Heartbeat rejection log POSITIVE CONTROL (hook disabled — must FAIL)
        run: |
          cd coordinator
          python3 test_beat_log.py --control
      - name: Worker heartbeats only a claimed range (#251)
        run: cd coordinator && python3 test_worker_beat.py
      - name: Worker heartbeat POSITIVE CONTROL (always-beat restored — must FAIL)
        run: |
          cd coordinator
          python3 test_worker_beat.py --control
      - name: Bundle pruning obeys all four conditions (#347)
        # Bundles are the largest thing on the coordinator's disk and grow with height: measured
        # 2026-09-17, 5.4 KB near genesis against 2.18 MB at 230,000, 95 GB for the first 230,000.
        # Deletion is REAL — bundle_path()'s legacy block_<n>.json fallback directory is EMPTY on the
        # live box, so removing a bundle removes the ability to serve or claim that height, and the
        # only way back is replaying the bridge forward from a checkpoint below it (0.145 s/block
        # measured at h=230,000). Every condition is therefore load-bearing. No real R2/B2: the
        # confirmation sets are injected, as hazync-offsite-proofs.main(argv, client=) allows.
        run: cd coordinator && python3 test_prune_bundles.py
      - name: Bundle pruning POSITIVE CONTROL (B2 unchecked, as if condition 3 were half-written — must FAIL)
        run: |
          cd coordinator
          python3 test_prune_bundles.py --control
      - name: Prune CALLER refuses on a partial or empty offsite listing (#397)
        run: cd coordinator && python3 test_prune_caller.py
      - name: Prune caller POSITIVE CONTROL (both-or-nothing removed — must FAIL)
        run: |
          cd coordinator
          python3 test_prune_caller.py --control
      - name: On-demand bundle regeneration picks a seed that can actually produce the block (#347)
        # The live bridge runs HAZYNC_BRIDGE_EMIT_FROM=967500, so 418,269-967,499 are walked past with no
        # bundle written, and bundles reach 17.0 MB by h=418,000 — >9 TB to store the gap against 3.9 TB
        # free. Those heights must be made on demand from an archived checkpoint. Both failure modes are
        # SILENT: a missing seed makes bridge_load_state() return None and the resume path rebuilds from
        # genesis (~6 days at the measured 533-599 ms/block), and a rung AT height N cannot produce block
        # N because replaying forward from N yields N+1 onward. No real bridge or replay here.
        run: cd coordinator && python3 test_regen_bundles.py
      - name: Regeneration POSITIVE CONTROL (a rung at the target accepted — must FAIL)
        run: |
          cd coordinator
          python3 test_regen_bundles.py --control
      - name: Checkpoint archiving stays correct when two bridges share one archive (#347)
        # The archiver's wrong answer is SILENT AND SAFE-LOOKING: concluding "not due" exits 0, prints one
        # tidy line and archives nothing, so nothing alerts. Counting the newest rung OVERALL rather than
        # the newest at or below the current height makes the backfill walk's archiver compute a negative
        # difference against the live bridge's higher rung — "not due" every hour for 41 hours, archiving
        # nothing — while prune_bundles.py goes on deleting bundles on the strength of rungs that are not
        # accumulating. journalctl is stubbed and every run is DRY, so no bridge and no copying.
        run: cd coordinator && python3 test_archive_checkpoint.py
      - name: Checkpoint archiving POSITIVE CONTROL (at-or-below rule removed — must FAIL)
        run: |
          cd coordinator
          python3 test_archive_checkpoint.py --control
      - name: Free space is watched at all (#397)
        run: cd coordinator && python3 test_check_disk.py
      - name: Disk check POSITIVE CONTROL (floor comparison removed — must FAIL)
        run: |
          cd coordinator
          python3 test_check_disk.py --control
      - name: Tip bundles that never arrive are noticed (hazync-admin#2)
        run: cd coordinator && python3 test_bundle_gap.py
      - name: Bundle gap POSITIVE CONTROL (gap arithmetic removed — must FAIL)
        run: |
          cd coordinator
          python3 test_bundle_gap.py --control
      - name: A healthy card is never mistaken for a wedged one (Phase 5 tip fleet)
        run: cd coordinator && python3 test_tip_fleet.py
      - name: Tip fleet POSITIVE CONTROL (idle guard removed — must FAIL)
        run: |
          cd coordinator
          python3 test_tip_fleet.py --control
      - name: The remote probe is never expanded on the orchestrator (Phase 5 tip driver)
        run: cd coordinator && python3 test_tip_driver.py
      - name: Tip driver POSITIVE CONTROL (body expanded locally — must FAIL)
        run: |
          cd coordinator
          python3 test_tip_driver.py --control
      - name: A card that cannot prove is never given a chunk (Phase 5 tip lifecycle)
        run: cd coordinator && python3 test_tip_lifecycle.py
      - name: Tip lifecycle POSITIVE CONTROL (METHOD_ID gate removed — must FAIL)
        run: |
          cd coordinator
          python3 test_tip_lifecycle.py --control

      # ── suites that existed but were never registered (hazync#382) ──────────────────────────────────
      #
      # Registration here is by hand, one step per test — there is no glob, `pytest` or discovery in this
      # workflow. Twelve coordinator suites were therefore never run by CI at all: not removed, not
      # quarantined, simply dropped on the way in. All twelve pass, `git log -S` over .github/ shows none
      # of them was ever registered and later taken out, no workflow file has ever been deleted, and they
      # are not merely recent (test_node_tip.py dates to 2026-08-17).
      #
      # Eleven of the twelve ship a POSITIVE CONTROL, so this adds 23 steps. A control that never runs is
      # the "checks that cannot fail" shape these controls exist to catch, one level up.
      #
      # Cost measured before adding them: 26 s for all twelve, plain + control, of which test_sponsor_bot
      # is 18 s and the rest are about a second each. No new dependencies — three import `cryptography`,
      # which eight already-registered suites here use today.
      - name: Claim caps (test_claim_cap.py)
        run: cd coordinator && python3 test_claim_cap.py
      - name: Claim caps POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_claim_cap.py --control
      - name: Claim retake (test_claim_retake.py)
        run: cd coordinator && python3 test_claim_retake.py
      - name: Claim retake POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_claim_retake.py --control
      - name: Signed claims, #310 (test_claim_signed.py)
        run: cd coordinator && python3 test_claim_signed.py
      - name: Signed claims POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_claim_signed.py --control
      - name: Folded count (test_folded_count.py)
        run: cd coordinator && python3 test_folded_count.py
      - name: Folded count POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_folded_count.py --control
      - name: Frontier blocker (test_frontier_blocker.py)
        run: cd coordinator && python3 test_frontier_blocker.py
      - name: Frontier blocker POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_frontier_blocker.py --control
      - name: Spine ranges (test_spine_ranges.py)
        run: cd coordinator && python3 test_spine_ranges.py
      - name: Spine ranges POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_spine_ranges.py --control
      # The only one of the twelve with no --control; registered plain.
      - name: Node tip (test_node_tip.py)
        run: cd coordinator && python3 test_node_tip.py
      # ⛔ The sponsor bot RENTS GPUs AND SPENDS REAL MONEY. test_sponsor_bot.py is 1,004 lines and its
      # own docstring says a bug that leaves a pod running or launches past a cap "spends real money and
      # nothing on the board would show it". It has a positive control. None of it has ever run in CI.
      - name: Sponsor bot — money safety, queue, cost log (test_sponsor_bot.py)
        run: cd coordinator && python3 test_sponsor_bot.py
      - name: Sponsor bot POSITIVE CONTROL (pods not terminated on error — must FAIL)
        run: |
          cd coordinator
          python3 test_sponsor_bot.py --control
      - name: Sponsor bot signed API, #351 (test_sponsor_bot_api.py)
        run: cd coordinator && python3 test_sponsor_bot_api.py
      - name: Sponsor bot API POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_sponsor_bot_api.py --control
      - name: Sponsorship holds (test_sponsor_holds.py)
        run: cd coordinator && python3 test_sponsor_holds.py
      - name: Sponsorship holds POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_sponsor_holds.py --control
      - name: Sponsorship identity keys (test_sponsor_identity.py)
        run: cd coordinator && python3 test_sponsor_identity.py
      - name: Sponsorship identity POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_sponsor_identity.py --control
      - name: Sponsorship payments (test_sponsor_payments.py)
        run: cd coordinator && python3 test_sponsor_payments.py
      - name: Sponsorship payments POSITIVE CONTROL (must FAIL)
        run: |
          cd coordinator
          python3 test_sponsor_payments.py --control
      - name: The sponsor bot tells the truth about blocks the bridge will never reach (#347)
        # The bot used to log "N held block(s) have no bundle yet and wait for the bridge". Below
        # h=418,268 that is true and the wait ends. Inside 418,269-967,499 it is FALSE: the live bridge
        # runs HAZYNC_BRIDGE_EMIT_FROM=967500, walks those heights writing nothing, and never returns —
        # so a sponsor could hold a block there for ever while the log said to be patient. The line now
        # reports whether the block can be rebuilt from an archived checkpoint and what that costs. The
        # message IS the feature; nothing else reports it, so it is pinned here.
        run: cd coordinator && python3 test_regen_advice.py
      - name: Sponsor bot advice POSITIVE CONTROL (no-checkpoint-below refusal disabled — must FAIL)
        run: |
          cd coordinator
          python3 test_regen_advice.py --control
      - name: Rescued-tree offsite copy — deterministic, encrypted, append-only (test_offsite_rescued.py)
        # /srv/bulk/hazync/rescued-from-old-box is 2.67 GB pulled off the coordinator retired on
        # 2026-09-19. Measured that day: ZERO offsite units named that path, against six covering other
        # paths, and the source box is stopped and disabled — so server 1 holds the only copy, including
        # a rescued ed25519 private key. Two properties carry the backup: the object is named by the
        # sha256 of a DETERMINISTIC tar (so the weekly run re-uploads nothing, rather than adding 2.67 GB
        # to an append-only bucket for ever), and the ciphertext is pinned to the operator's public key
        # (a swapped key would still "succeed" and restore nothing).
        run: cd coordinator && python3 test_offsite_rescued.py
      - name: Rescued-tree offsite POSITIVE CONTROL (determinism defeated — must FAIL)
        run: |
          cd coordinator
          python3 test_offsite_rescued.py --control
      - name: Regeneration queue — one replay at a time, never beside a bridge (test_regen_queue.py)
        # Advice reports; the queue ACTS, and acting spends coordinator CPU on a paid block. Two guards
        # matter and neither is tidiness: a replay is ~10 GB of accumulator on a 62.8 GiB box that also
        # serves the board, so two at once is two bridges on one machine — the shape that OOM-killed the
        # live bridge 23 times on 2026-09-18 while systemd reported `active (running)` throughout. The
        # second guard refuses to start beside the backfill, which has NO resume: killing it at 76% costs
        # a walk from genesis. bridge_running() is tested against a FAKE /proc, so the result cannot depend
        # on what happens to be running on the runner.
        run: cd coordinator && python3 test_regen_queue.py
      - name: Regeneration queue POSITIVE CONTROL (both guards disabled — must FAIL)
        run: |
          cd coordinator
          python3 test_regen_queue.py --control
      - name: Tip controller — fleet scaling from the prover's own progress (test_tip_controller.py)
        # The tip target is every block proven inside 10 minutes and published at tip-1, so the fleet is
        # sized DURING the proof and the decision function IS the feature: nothing else decides whether a
        # card is rented or dropped. Two guards protect against acting on a number that is not there.
        # seg-serve reports "joins 25/2352" through the whole assembly phase with no elapsed and no ETA,
        # and the join tree does not divide across workers at all (main.rs:5381) — so cards added there
        # cannot help and still cost money. And slow_tail compares each card against the fleet's own
        # median on THIS block, which with one card would cull the only card proving.
        run: cd coordinator && python3 test_tip_controller.py
      - name: Tip controller POSITIVE CONTROL (both guards disabled — must FAIL)
        run: |
          cd coordinator
          python3 test_tip_controller.py --control
      - name: A distributed (mode-6) prove beats its claim (#361/#364)
        # seg-serve prints "91/2352 segments" and "joins 25/2352" — number FIRST, noun PLURAL — while a
        # single-card prove prints "segment 91/2352". _PROGRESS_RE knew only the latter, so st["n"] never
        # rose on a distributed run, the progress-gated beat never fired, and a claim that has NEVER
        # beaten is released after CLAIM_GRACE (600 s, #296). Block 74,928 took 3,694 s across three
        # cards, so the operator lost the block ten minutes in. Scenario 3 is the #256 guard: a silent
        # host must still beat NOTHING.
        run: cd coordinator && python3 test_mode6_progress.py
      - name: Mode-6 beat POSITIVE CONTROL (old single-card pattern restored — must FAIL)
        run: |
          cd coordinator
          python3 test_mode6_progress.py --control
      - name: Distributed run — beat, teardown and the stall window (#367)
        # `hazync run --distributed` cannot reuse _prove_watched/_run_with_seg_retry, and each reason is
        # a way to lose a block: that wrapper takes gpu_lock ("one GPU job at a time, per box") while
        # mode 6 SERVES and its workers prove; its stall watchdog arms only for prove-range/-bridge, so
        # seg-serve would run with NO progress window at all; and the run owns a server plus N worker
        # processes, which main() installs no handlers to clean up. Beat, watchdog and teardown are
        # therefore hand-rolled, and this suite is what says they work. It caught the beat wired into
        # the poll loop instead of a ticker — a fast fleet would have finished having beaten NOTHING,
        # losing the block to CLAIM_GRACE exactly as #368 did on the single-card path.
        run: cd coordinator && python3 test_distributed_run.py
      - name: Distributed run POSITIVE CONTROL (teardown neutered — must FAIL)
        run: |
          cd coordinator
          python3 test_distributed_run.py --control
      - name: A downloaded proof is named, with its own extension (#278)
        # `curl -O` names a file after the URL path, so /api/proof/1 landed as an extensionless "1".
        # Also pins the host<->worker filename contract: the worker does not pass HAZYNC_OUT, so it
        # has to know what the host called the file, and that break costs a whole prove.
        run: cd coordinator && python3 test_proof_names.py
      - name: Proof naming POSITIVE CONTROL (Content-Disposition stripped — must FAIL)
        run: |
          cd coordinator
          python3 test_proof_names.py --control
      - name: Coordinator does not jam under concurrent load (#265)
        # WAL (a writer is not blocked by an open reader) + single-flight state/frontier caches.
        run: cd coordinator && python3 test_coord_concurrency.py
      - name: Concurrency POSITIVE CONTROL (rollback journal + old stampeding cache — must FAIL)
        run: |
          cd coordinator
          python3 test_coord_concurrency.py --control
      - name: /api/vranges does not stampede or exhaust open files (2026-09-13 outage)
        # Single-flight rebuild, explicit close, soft open-file limit raised, fold count in /api/state.
        run: cd coordinator && python3 test_vranges_cache.py
      - name: vranges POSITIVE CONTROL (old plain-TTL cache, no limit raise — must FAIL)
        run: |
          cd coordinator
          python3 test_vranges_cache.py --control
      - name: Offsite receipt mirror is append-only and its check can fail (R2, 2026-09-15)
        run: cd coordinator && python3 test_offsite_proofs.py
      - name: Offsite mirror POSITIVE CONTROL (re-uploads everything — must FAIL)
        run: |
          cd coordinator
          python3 test_offsite_proofs.py --control
      - name: Backup notifications push once, recover once, and the daily summary tells the truth
        run: cd coordinator && python3 test_offsite_watch.py
      - name: Backup notifications POSITIVE CONTROL (watcher blind, every check ok — must FAIL)
        run: |
          cd coordinator
          python3 test_offsite_watch.py --control
      - name: Block map API (blockstatus, block detail, sponsorship, weak ETags)
        run: cd coordinator && python3 test_block_api.py
      - name: Block map API POSITIVE CONTROL (strong-only ETag, unpaid sponsor names — must FAIL)
        run: |
          cd coordinator
          python3 test_block_api.py --control
      - name: A box with no usable GPU stops instead of claiming block after block (#261)
        run: cd coordinator && python3 test_worker_device.py
      - name: No-usable-GPU POSITIVE CONTROL (device errors treated as ordinary — must FAIL)
        run: |
          cd coordinator
          python3 test_worker_device.py --control
      - name: Worker watches a prove for progress, not silence (#256)
        run: cd coordinator && python3 test_worker_progress.py
      - name: Progress watchdog POSITIVE CONTROL (progress lines unrecognised — must FAIL)
        run: |
          cd coordinator
          python3 test_worker_progress.py --control
      - name: A worker that stops or keeps failing tells its prover through ntfy (hazync notify)
        run: cd coordinator && python3 test_worker_notify.py
      - name: Worker alerts POSITIVE CONTROL (alerts never sent — must FAIL)
        run: |
          cd coordinator
          python3 test_worker_notify.py --control
      - name: release.sh attests the CUDA host it cannot run (#275)
        # The fallback that lets a GPU-less release box publish the CUDA host sat under a STALENESS
        # check, which is true for exactly the fresh artifact that needs it — so it never ran, and
        # v0.21.1 and v0.21.2 were published only because the operator passed the id by hand.
        run: ./scripts/test-release-attest.sh
      - name: CUDA attestation POSITIVE CONTROL (staleness gate restored — must FAIL)
        run: ./scripts/test-release-attest.sh --control
      - name: Who absorbed each block into the spine (#244)
        # The record was never lost — every absorption writes a permanent spine:1-<hi> row — but the
        # only thing reading it was the 40-row `recent` feed, so attribution aged out in minutes.
        run: cd coordinator && python3 test_spine_segments.py
      - name: Spine segments POSITIVE CONTROL (runs keyed on handle — must FAIL)
        run: |
          cd coordinator
          python3 test_spine_segments.py --control
      - name: Leaderboard splits proved / folded / anchored (#244)
        # A fold submits a WIDE range, so crediting it as blocks handed the folder work somebody else
        # did — the columns summed to 1,157 blocks more than the chain had. Anchoring counted nothing.
        run: cd coordinator && python3 test_contributions.py
      - name: Contribution split POSITIVE CONTROL (every wide range read as a fold — must FAIL)
        run: |
          cd coordinator
          python3 test_contributions.py --control
      # Not in CI until now, which is how hazync#289's rename of distinct_blocks_by_pubkey broke it
      # silently: it has been failing on main since that merged, and nothing said so. It has no
      # --control mode, so it runs once.
      - name: Key rotation carries a contributor's proved blocks to the new key (#113)
        run: cd coordinator && python3 test_rotation.py
      - name: Client versions are recorded and surfaced (#293)
        # Block 39,413 pinned the frontier for 5h and the server could only say "a live worker is
        # proving it". It was #286 — 757s of assembly against a 600s silence timeout that release
        # removed — and the holder's version was the one fact nobody had.
        run: cd coordinator && python3 test_client_version.py
      - name: Client version POSITIVE CONTROL (recorded only on submit — must FAIL)
        run: |
          cd coordinator
          python3 test_client_version.py --control
      - name: A claim nobody is working on is released in minutes (#296)
        # 237 blocks were held by two contributors who were not proving them, while the most
        # productive prover on the board held TWO claims. Liveness could not tell "working" from
        # "gone": a never-beaten claim got the same hour as one being actively proved.
        run: cd coordinator && python3 test_claim_grace.py
      - name: Claim grace POSITIVE CONTROL (grace = CLAIM_TTL, the old behaviour — must FAIL)
        run: |
          cd coordinator
          python3 test_claim_grace.py --control
      - name: The blocked-block warning judges the current claim, not the history (#360)
        # `_continuous` compared this claim's age to the whole stall, and claim() resets claimed_at on
        # every hand-over — so after ONE hand-over it could never be true again and the "large block,
        # not a stall" exemption was unreachable. Block 74,928 was accused of "failing on a bug already
        # fixed" while being proved normally. Scenario 3 is the #286 (39,413) regression guard.
        run: cd coordinator && python3 test_blocker_message.py
      - name: Blocked-block warning POSITIVE CONTROL (latching _continuous restored — must FAIL)
        run: |
          cd coordinator
          python3 test_blocker_message.py --control
      - name: G1 retention gate still detects a missing receipt (positive control)
        # check-retention.py is what separates "the board says this block is proven" from "we can
        # hand you the proof for it" — G1's actual content. It runs unattended on the coordinator, so
        # the dangerous failure is not it reporting a hole, it is reporting CLEAN while one exists.
        #
        # This tests the CHECKER against synthetic fixtures. It deliberately does NOT verify
        # production retention: that needs the coordinator's real DB and proof store, which CI has
        # not got and should not have. Its job is to prove the gate can still fail.
        run: ./coordinator/test-check-retention.sh
      - name: Integrity checks detect a bad genesis proof, a broken seam, a corrupt proof, and alert once (positive controls)
        # check-spine.py, check-continuity.py and check-proofs.py run unattended on the coordinator and the web box and
        # push to a phone. Each must pass a good fixture and FAIL every planted fault; the alert wrapper must push once,
        # hourly while a failure lasts, and on recovery. Fake verifier, node and host: real proofs are not in CI.
        run: python3 coordinator/test-integrity-checks.py
      - name: A wide range must be a fold, the genesis seed included (#281)
        # Was not in CI, so nothing would have noticed it breaking. The [0..hi] genesis seed used to be
        # exempt from the fold rule, the one way left to put coverage on the board with no per-block
        # receipt beneath it -- the G1 hole the step above exists to catch.
        run: cd coordinator && python3 test_overlap_guard.py
      - name: Overlap guard POSITIVE CONTROL (guard removed — must FAIL)
        run: |
          cd coordinator
          python3 test_overlap_guard.py --control
      - name: Block 0 (genesis) is refused at every entry point, with the reason, before any work
        # Genesis is the most famous block in Bitcoin, so people will try to prove, submit and sponsor it.
        # It is the anchor every proof is pinned to and cannot be proved.
        run: cd coordinator && python3 test_genesis.py
      - name: Genesis refusal POSITIVE CONTROL (refusals removed — must FAIL)
        run: |
          cd coordinator
          python3 test_genesis.py --control
      - name: One spelling per range, and a block with its own proof is not proved again
        # `5-5`, `05`, `+5` and ` 5` each named block 5 afresh, so a proven block could be verified and
        # stored again without limit. A block covered only by a wide range can still get its own proof.
        run: cd coordinator && python3 test_canonical_ids.py
      - name: Canonical ids POSITIVE CONTROL (guards removed — must FAIL)
        run: |
          cd coordinator
          python3 test_canonical_ids.py --control
      - name: Alerts still say something (no destination is loud, a crash loop alerts once, the watchdog sees a dead coordinator)
        # 2026-09-14: the G1 check above had failed on the coordinator every night since 2026-09-12 and
        # nobody knew -- a failed unit is a journal line nobody reads. These are the positive controls
        # for the path that is supposed to tell someone.
        run: ./coordinator/deploy/test-alerting.sh
      - name: Coordinator worker parses (nothing else imports it, so nothing else would notice)
        # coordinator/server.py IS compiled on every push, because seam_fuzz.py and parse_fuzz.py both
        # `import server`. coordinator/hazync is not: it has no .py extension, so it is not importable
        # and no test touches it. 510 lines of fold/claim logic whose syntax errors would surface only
        # when a worker runs it, mid-campaign.
        run: |
          python3 -c "import ast,sys; ast.parse(open('coordinator/hazync').read()); print('coordinator/hazync parses')"
          python3 -c "import ast,sys; ast.parse(open('coordinator/server.py').read()); print('coordinator/server.py parses')"
          # Assert the fuzzers really do import server, since that is what covers it. If this ever stops
          # being true, server.py silently loses its only compile check.
          grep -q '^import server' coordinator/seam_fuzz.py || { echo "::error::seam_fuzz no longer imports server — server.py has lost its compile coverage"; exit 1; }
          grep -q '^import server' coordinator/parse_fuzz.py || { echo "::error::parse_fuzz no longer imports server — server.py has lost its compile coverage"; exit 1; }

      - name: Prove-path segment guards (risc0 segment-boundary bug can't recur silently)
        run: ./prover/check_seg_guards.sh
      - name: Standalone verifier — builds, verifies, and rejects a non-genesis proof (#19, #24)
        # The product claim is that a phone can check a few-KB proof. This builds the verify-only
        # binary (no prover, no guest ELF) and runs it against the same fixtures the host is gated on.
        # It must ACCEPT the genesis-anchored proof and REJECT the non-genesis one — a verifier that
        # checked less would make a fabricated-anchor range MORE shareable, not less.
        run: |
          cargo build --release --manifest-path verifier/Cargo.toml
          B=verifier/target/release/hazync-verify
          echo "verifier size: $(stat -c%s "$B") bytes"
          # Assert EXACT exit codes, not merely "non-zero". A bare `if $B neg500; then fail; fi`
          # also passes when the binary segfaults, which is a check that cannot distinguish "correctly
          # refused" from "crashed" — the exact failure mode this suite exists to catch elsewhere.
          #   0 = verified and genesis-anchored
          #   1 = the proof is invalid (forged/tampered/corrupt/wrong guest)
          #   2 = the SNARK is valid but the range is not genesis-anchored
          # `cmd; rc=$?` does NOT work here: GitHub runs these under `bash -e`, so a non-zero exit
          # kills the step before rc is ever assigned. `|| rc=$?` is the form that survives set -e.
          rc=0; "$B" prover/testdata/snark/fold_8.snark || rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::verifier REJECTED the genesis-anchored proof (exit $rc)"; exit 1
          fi
          rc=0; "$B" prover/testdata/snark/neg500.snark >/dev/null 2>&1 || rc=$?
          if [ $rc -eq 0 ]; then
            echo "::error::verifier ACCEPTED a non-genesis range — the genesis pin is not enforced"; exit 1
          fi
          if [ $rc -ne 2 ]; then
            echo "::error::non-genesis range gave exit $rc, expected 2 — it was refused for the WRONG"
            echo "::error::reason (2 means 'valid SNARK, not anchored'; 1 means 'invalid proof')"; exit 1
          fi
          echo "verifier rejects the non-genesis range with the anchoring code ✓"
      - name: FFI verifier — adversarial suite from C++ (#31)
        # ghostd will call THIS, not a C++ reimplementation of risc0 verification, and #31 makes
        # "adversarial tests first" non-negotiable: adopting a proof is a trust decision, and a bug
        # here means accepting an invalid chain — strictly worse than slow IBD.
        #
        # Every case asserts the output struct is left BYTE-FOR-BYTE untouched on rejection. The
        # smoke test this replaces printed "state correctly not written" and checked nothing, so a
        # rejection path that wrote partial state would have passed it while reassuring the reader.
        #
        # The baseline acceptance runs FIRST and hard-fails the suite: a verifier that rejects
        # everything passes an adversarial suite trivially.
        run: |
          cargo build --release --manifest-path verifier-ffi/Cargo.toml
          g++ -O2 -I verifier-ffi/include prover/testdata/ffi_adversarial.cpp \
              verifier-ffi/target/release/libhazync_verify.a -lpthread -ldl -lm -o /tmp/ffi_adv
          /tmp/ffi_adv prover/testdata/snark/fold_8.snark prover/testdata/snark/neg500.snark
      - name: WASM verifier agrees with the CLI on every fixture (browsers are the copy nobody can audit)
        # The browser build is the copy most people will run and the one least inspectable after the
        # fact. It shares hazync_verify::verify with the CLI, so it cannot disagree "in principle" —
        # but that is exactly what was true of the RangeState mirrors before they drifted (#32).
        # Asserted against real proofs plus mutations that must be refused.
        run: |
          rustup target add wasm32-unknown-unknown
          ./verifier-wasm/build.sh
          ./verifier-wasm/test-parity.sh
      - name: SPEC.md formats match the code (a drifted spec is worse than no spec)
        # docs/SPEC.md is normative about byte layouts and constants. If it drifts, a reviewer
        # implements against it, their verifier disagrees with ours, and the disagreement looks like
        # OUR bug. Only mechanically checkable claims are covered — constants, tags, and the full
        # RangeState field list in declaration order, because the journal decodes positionally.
        run: ./scripts/check-spec.sh
      - name: Utreexo hash construction agrees across host, guest Rust and guest C++
        # Three implementations of the same hash. A drift means the host builds proofs the guest
        # cannot verify — and only for SOME blocks, because the domain tag only matters once a leaf
        # preimage length collides with an interior node's. Same failure shape as the RangeState
        # mirrors, so it gets a check rather than a comment saying "MUST stay byte-identical".
        run: ./scripts/check-utreexo.sh
      - name: Guest libc shims agree with glibc (they compile into the image, so they are consensus code)
        # cshims.c satisfies libc references pulled in by libstdc++/newlib when Core is compiled to
        # RISC-V. Nothing on the consensus path calls them (call sites resolved in hazync#55), but
        # they are IN the image, so a defect changes what a proof attests. Their semantics are plain
        # C, so unlike the rest of the guest they can be built for the host and differentially
        # tested against glibc without a zkVM. Carries positive controls against the previous
        # implementation — the version whose strtoul ignored its base and whose _sbrk checked only
        # the upper bound.
        run: ./prover/methods/guest/test-cshims.sh
      - name: RangeState mirrors agree (a reordered field MISREADS a valid proof, it does not reject it)
        run: ./scripts/check-rangestate.sh
      - name: Every crate the GUEST compiles is flagged as a METHOD_ID input
        # "guest source" is wider than prover/methods/guest/ — the guest has path dependencies, and
        # editing one re-baselines the board with nothing in the guest directory changed. That has
        # already happened once (coinbase-smt's empty_root: 4ea6567b -> 35cfbbed).
        run: ./scripts/check-guest-inputs.sh
      - name: Workflow YAML valid (a bad step name can silently break the whole run)
        run: ./scripts/check-workflows.sh
      - name: No workflow splices an expression into a shell block (arbitrary code where the signing key lives)
        # GitHub splices ${{ }} into the script before bash parses it, so a value with shell
        # metacharacters executes as code. release-sign.yml did this with the release tag while
        # holding GPG_PRIVATE_KEY and contents: write, and workflow_dispatch let any write-access
        # account supply that tag. Found by external review 2026-08-01; the gate exists so it cannot
        # come back one hurried `gh release upload` at a time.
        run: ./scripts/check-workflow-injection.sh
      - name: Versions agree (guest id + release refs across docs; a re-baseline must not leave a doc stale)
        run: ./scripts/check-versions.sh
      - name: Coordinator reference matches server.py, the worker CLI and the launcher (with its positive control)
        # docs/COORDINATOR_REFERENCE.md is generated. --check fails on drift, including a route or variable
        # with no description and a description for something the code no longer has; --control mutates
        # copies of the sources (a route removed, a default changed, a variable added) and fails if --check
        # misses any of them, so this step cannot go green by checking nothing.
        run: python3 scripts/gen-coordinator-reference.py --check && python3 scripts/gen-coordinator-reference.py --control
      - name: Guest lineage is append-only and matches git history (#244)
        # A receipt stays verifiable only while we keep its method id AND can rebuild the risc0
        # verifier that checked it, so the thing that destroys a back catalogue is a re-baseline
        # sweep quietly taking a superseded row with it. reproduce/LINEAGE.tsv is a materialised
        # view of git history, and this is the gate that says the view still matches the evidence.
        # Needs the fetch-depth: 0 checkout above — on a shallow clone the check refuses to run.
        run: ./scripts/lineage.sh --check
      - name: Lineage gate still catches a deleted or rewritten row (positive control)
        run: ./scripts/test-lineage.sh
      - name: Lineage POSITIVE CONTROL (row COUNT compared instead of contents — must FAIL)
        run: ./scripts/test-lineage.sh --control
      - name: Test surfaces are connected (no test that reports green while measuring nothing)
        run: ./scripts/check-test-surfaces.sh
      - name: check-dist attestation path (#248)
        # A CUDA host that cannot execute here must PASS when attested (no FAIL line), and FAIL when
        # unattested or attested with the wrong id. Against the pre-#248 script it fails 2 checks.
        run: ./scripts/test-check-dist.sh
      - name: Shellcheck (scripts run as root on the coordinator and as build tooling)
        # Caught a real one: check-test-surfaces.sh had an unguarded `cd`, so a failed cd would have
        # run every check against the wrong directory, found no test surfaces, and PASSED.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning $(git ls-files '*.sh')

  boundary-heavy:
    # The six expensive activation-boundary blocks (#83): 388380, 419327/8, 434499, 481823/4.
    # ~30,700 prevouts, ~34 minutes. Nightly and on demand, never per push.
    #
    # 434499 is the one that matters most: the first pre-segwit block whose coinbase carries a BIP141
    # commitment with no witness data anywhere. witness_ok's own comment records that checking the
    # commitment at every height "rejected the canonical pre-activation blocks ... a reject-valid
    # liveness bug in the 433k-481823 range". That was fixed and nothing drove the window it broke.
    #
    # 419328 and 481824 are both exactly 2016k, because BIP9 forks activate ON retarget boundaries —
    # which is why their fixtures carry a real epoch_start rather than a synthesised one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision (RISC0 toolchain, Bitcoin Core v28 source, patches, build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./provision-vps.sh
      - name: Activation boundaries — heavy set
        run: |
          cd prover && HAZYNC_HOST=./target/release/host ./ci_boundary_tests.sh heavy

  soundness-suite:
    # Full build (RISC0 toolchain + Core source + patches) then run regress + adversarial.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision (RISC0 toolchain, Bitcoin Core v28 source, patches, build)
        env:
          REPO_DIR: ${{ github.workspace }}
          # rzup authenticates its GitHub API calls with this, avoiding the anonymous
          # rate limit that otherwise flakes the toolchain install on shared CI runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./provision-vps.sh
      - name: Guest image id (METHOD_ID) — for reproducibility tracking
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host method-id
      - name: Block-170 consensus regression
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host regress
      - name: Adversarial soundness suite (every hole must REJECT)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host adversarial
      - name: Consensus reject-path negative tests (COV-1 time-too-old, COV-2 merkle CVE-2012-2459, SEC-2 forged accumulator inclusion)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && HAZYNC_HOST=./target/release/host ./ci_negative_tests.sh
      - name: Consensus activation boundaries — real blocks, cheap set (#83)
        # Before #83 the fixtures were 130000/140000 (before every activation) and 741000 (after all of
        # them), so every height gate in validate_block had one side exercised and no boundary. These
        # are the real blocks either side of BIP34, BIP66 and BIP65.
        #
        # CHEAP SET ONLY here. Cost tracks prevout count: block 741000 has 670 and runs in ~45s; this
        # set totals ~2,760 (~3 min). The heavy six total ~30,700 (~34 min) and run on a schedule
        # instead — adding half an hour to every push to re-execute blocks that never change is how a
        # suite gets switched off six months later.
        run: |
          cd prover && HAZYNC_HOST=./target/release/host ./ci_boundary_tests.sh cheap
      - name: Leaf preimage — all THREE implementations agree byte for byte (#50)
        # MOVED HERE FROM accumulator-tests. That job is deliberately "fast, always-green: the pure-Rust
        # accumulator" and provisions NO Core sources — but leaf-differential's build.rs compiles Bitcoin
        # Core natively to call the guest's real C++ leaf builders. Putting it there broke the job's
        # premise and failed with exit 101; this job already provisions Core, which is what it needs.
        #
        # It gates the accumulator's leaf preimage BYTES (field order, widths, endianness,
        # length-prefixing) across the C++ spend-side, C++ create-side and Rust builders — not just the
        # tag shape check-utreexo.sh does.
        run: |
          HAZYNC_BASE="$HOME/hazync-build" cargo test --manifest-path leaf-differential/Cargo.toml --release
      - name: Bridge <-> guest BIP30 agreement (host unit tests)
        # MOVED HERE FROM accumulator-tests, for the same reason leaf-differential moved: prover/host
        # depends on the `methods` crate, whose build script builds the GUEST — so it needs the RISC0
        # toolchain, which the fast job deliberately does not install. It failed with
        # "Risc Zero Rust toolchain not found".
        #
        # The bridge emits the SMT proofs and the guest consumes them; the two must agree about which
        # intermediate root each proof is taken against. Both halves are individually well-formed, so a
        # disagreement fails CLOSED — it looks like a board that stopped advancing, not a wrong answer.
        run: cargo test --manifest-path prover/host/Cargo.toml --release
      - name: BIP30 grandfathered overwrite (real block 91842)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host check-bip30
      - name: Retarget differential (carved real Core pow.cpp vs actual on-chain nBits at every mainnet retarget)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./retarget_diff_test.sh
      - name: Script-flag schedule differential (guest ⊇ Core, buried forks exact, exception blocks)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host script-flags-test
      - name: Bundle JSON round-trip (regression for the v0.9.0 spend-block parse bug, block 170)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host bundle-roundtrip-test
      - name: Chainparams anchor (Core's compiled consensus constants == canonical mainnet values)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./chainparams_check.sh
      - name: BIP68 relative-locktime matrix (real mainnet MTP, height and time based)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./test_bip68_locks.sh
      - name: BIP68 time-lock on a real mainnet transaction (and the pre-CSV non-enforcement control)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./test_bip68_real.sh

  deployed-verifier:
    # Everything else in this file tests an artifact we BUILD. This one tests the artifact we SERVE.
    #
    # On 2026-08-11 the browser verifier on bitcoinghost.org was two re-baselines behind — it reported
    # guest b161735a while the coordinator served proofs under 4722cec8 — so the site told every
    # visitor the live spine was "forged, tampered, corrupt". It had been that way for a week. CI was
    # green throughout and correctly so: the release shipped the right wasm, the build was never at
    # fault, and the web deploy is a manual step no gate here could see. The two modules are also
    # byte-for-byte the SAME SIZE, so nothing short of executing method_id() notices.
    #
    # Scheduled + manual only, deliberately. The failure mode is drift over days, not per-commit, and
    # a momentarily unreachable web box must not fail somebody's push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The verifier the public actually loads still checks the proof the site actually serves
        run: ./scripts/check-deployed-verifier.sh

  dependency-audit:
    # Nothing was scanning dependencies for known advisories until now. This job fails on any NEW one.
    #
    # The three below are explicitly accepted rather than left to make the build permanently red — a
    # scanner that is always failing gets ignored, which is worse than no scanner. Each is re-checked
    # here every push, so if one becomes fixable (or a fourth appears) it surfaces immediately.
    #
    #   RUSTSEC-2025-0055  tracing-subscriber 0.2.25, ANSI escapes in logged user input. Reached only
    #                      via ark-relations -> risc0-groth16. The host's OWN subscriber is 0.3.23,
    #                      which is patched. Removing the 0.2.25 needs a risc0 bump, and risc0 versions
    #                      feed the guest image id — so it cannot be done without a METHOD_ID
    #                      re-baseline and a full board re-prove.
    #   RUSTSEC-2023-0071  rsa 0.9.10 Marvin timing sidechannel, via rzup (the toolchain installer).
    #                      Hazync performs no RSA private-key operations. NO upstream fix exists.
    #   RUSTSEC-2024-0388  derivative 2.2.0 unmaintained (not a vulnerability), same ark path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit every lockfile
        run: |
          IGNORE="--ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0388"
          rc=0
          # The verifier lockfiles were NOT audited, and they are the SHIPPED artifacts — the
          # standalone verifier, the C ABI ghostd links, and the browser build. All three pull
          # ark-bn254 -> ruint for Groth16 verification, so an advisory there lands directly in what
          # users run. Missed by the original list because they are not part of the prover workspace.
          for f in accumulator prover prover/methods/guest guest-pure-fuzz verifier verifier-ffi verifier-wasm; do
            echo "== $f =="
            cargo audit --file "$f/Cargo.lock" $IGNORE || rc=1
          done
          exit $rc

  reproducible-image-id:
    # Build the guest in the hermetic container (fixed paths) and assert its METHOD_ID equals the
    # published canonical id in reproduce/METHOD_ID. Fails on any drift — the reproducibility guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible container (guest at fixed paths)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=gh_token,env=GITHUB_TOKEN -t hazync-repro -f reproduce/Dockerfile .
      - name: Assert built METHOD_ID == canonical (reproduce/METHOD_ID)
        run: |
          BUILT=$(docker run --rm hazync-repro | grep -oE 'METHOD_ID [0-9a-f]{64}' | awk '{print $2}')
          CANON=$(grep -vE '^[[:space:]]*#' reproduce/METHOD_ID | grep -oE '[0-9a-f]{64}' | head -1)
          echo "built     = $BUILT"
          echo "canonical = $CANON"
          if [ -z "$BUILT" ] || [ "$BUILT" != "$CANON" ]; then
            echo "::error::guest METHOD_ID drifted from the canonical id — reproducibility broken"
            exit 1
          fi
          echo "reproducible METHOD_ID matches canonical ✓"
      - name: Groth16 SNARK verification + genesis-pin negative control (#23)
        # Runs HERE, not in soundness-suite, and the reason is not incidental: a RISC0 guest image id
        # absorbs the build's $HOME/.cargo paths, so the host that soundness-suite builds on the runner
        # ($HOME=/home/runner) has a NON-canonical METHOD_ID. The checked-in fixtures are pinned to the
        # canonical id, so only the fixed-path container build can verify them — this job is the one
        # place a canonical host exists. Putting the check in soundness-suite failed with an image-id
        # mismatch that looked like a broken proof and was actually a build-path mismatch.
        run: |
          docker run --rm hazync-repro sh -c \
            'cd /hazync-zkvm/prover && HAZYNC_HOST=/hazync-zkvm/prover/target/release/host ./ci_snark_verify.sh'
      - name: verify-any gate — the command the COORDINATOR runs on every submission
        # `host verify-any` is the sole gate between a submitted receipt and the board, and NOTHING in
        # CI ran it. The standalone verifier is well covered, but that is a different code path with a
        # different genesis condition — verify-any deliberately accepts valid MID-CHAIN ranges, which
        # is exactly what the covered path refuses.
        #
        # Here rather than in soundness-suite for the same reason as the step above: only the
        # fixed-path container has a canonical METHOD_ID, so only it can verify the checked-in
        # fixtures. A runner-built host rejects them as a build mismatch.
        run: |
          docker run --rm hazync-repro sh -c \
            'cd /hazync-zkvm/prover && HAZYNC_HOST=/hazync-zkvm/prover/target/release/host ./ci_verify_any.sh'
