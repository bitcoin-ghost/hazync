name: adversarial

# Builds the real prover (Bitcoin Core consensus code -> riscv32 guest) and runs the self-contained
# soundness checks on every push: the block-170 consensus regression and the adversarial suite, which
# asserts that a witness exploiting each known hole (host-controlled height, in-block double-spend /
# ordering, malformed coinbase) is REJECTED, alongside an honest baseline that must be accepted.

# `push:` was unqualified, so every branch with an open PR ran the whole suite TWICE — once for the
# push and once for the pull_request. soundness-suite is a 45+ minute job, so on a night with five
# PRs open that was five wasted hours of runner time and a queue nothing could get through.
#
# Now: branches are covered by `pull_request`, and `main` by `push` — which still matters, because
# some jobs only ever run on main and a green PR is not a green main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseding a branch makes its in-flight run pointless; let it be cancelled rather than sit in the
# queue ahead of the run that matters. NOT applied to main: those runs are the record of what the
# released tree actually does, and cancelling one leaves a commit with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  accumulator-tests:
    # Fast, always-green: the pure-Rust Utreexo accumulator (single-delete vs a full-forest oracle).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed by check-versions.sh to compare the documented "current release" against the
          # newest tag. The default shallow checkout has none, and the check would silently skip.
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - name: Utreexo accumulator tests
        run: cargo test --manifest-path accumulator/Cargo.toml --release
      - name: Guest pure-Rust tests (activation heights, add256, median_time_past, utreexo SEC-2 pinning)
        run: cargo test --manifest-path guest-pure-fuzz/Cargo.toml --release
      - name: Accumulator fuzz-harness unit tests
        run: cargo test --manifest-path audit-fuzz/Cargo.toml --release
      - name: Coordinator seam fuzz (soundness — must find NOTHING)
        run: cd coordinator && python3 seam_fuzz.py 20000
      - name: Coordinator seam fuzz POSITIVE CONTROL (H9 guard removed — must find SOMETHING)
        # Exits 1 when it finds nothing: that state means the harness has gone blind and every clean
        # run above is meaningless. A fuzzer is only evidence while its control still fires.
        run: cd coordinator && python3 seam_fuzz.py --control
      - name: Coordinator input-handler fuzz (parse_range / clean_handle / is_hex)
        run: cd coordinator && python3 parse_fuzz.py 30000
      - name: Spine + fold logic (#30, #37)
        # foldable() pair selection, the range-id grammar, and the spine's store/monotonic/serve path.
        # NOT covered, deliberately and stated in the script: real STARK verification (needs the
        # 184 MB host binary) and actual folding (a prove op; CI has no GPU). Those are verified by
        # hand against real board receipts under prover/evidence/.
        run: cd coordinator && python3 test_spine_fold.py
      - name: Spine + fold POSITIVE CONTROL (already-folded check removed — must FAIL)
        run: |
          cd coordinator
          python3 test_spine_fold.py --control
      - name: G1 retention gate still detects a missing receipt (positive control)
        # check-retention.py is what separates "the board says this block is proven" from "we can
        # hand you the proof for it" — G1's actual content. It runs unattended on the coordinator, so
        # the dangerous failure is not it reporting a hole, it is reporting CLEAN while one exists.
        #
        # This tests the CHECKER against synthetic fixtures. It deliberately does NOT verify
        # production retention: that needs the coordinator's real DB and proof store, which CI has
        # not got and should not have. Its job is to prove the gate can still fail.
        run: ./coordinator/test-check-retention.sh
      - name: Coordinator worker parses (nothing else imports it, so nothing else would notice)
        # coordinator/server.py IS compiled on every push, because seam_fuzz.py and parse_fuzz.py both
        # `import server`. coordinator/hazync is not: it has no .py extension, so it is not importable
        # and no test touches it. 510 lines of fold/claim logic whose syntax errors would surface only
        # when a worker runs it, mid-campaign.
        run: |
          python3 -c "import ast,sys; ast.parse(open('coordinator/hazync').read()); print('coordinator/hazync parses')"
          python3 -c "import ast,sys; ast.parse(open('coordinator/server.py').read()); print('coordinator/server.py parses')"
          # Assert the fuzzers really do import server, since that is what covers it. If this ever stops
          # being true, server.py silently loses its only compile check.
          grep -q '^import server' coordinator/seam_fuzz.py || { echo "::error::seam_fuzz no longer imports server — server.py has lost its compile coverage"; exit 1; }
          grep -q '^import server' coordinator/parse_fuzz.py || { echo "::error::parse_fuzz no longer imports server — server.py has lost its compile coverage"; exit 1; }

      - name: Prove-path segment guards (risc0 segment-boundary bug can't recur silently)
        run: ./prover/check_seg_guards.sh
      - name: Standalone verifier — builds, verifies, and rejects a non-genesis proof (#19, #24)
        # The product claim is that a phone can check a few-KB proof. This builds the verify-only
        # binary (no prover, no guest ELF) and runs it against the same fixtures the host is gated on.
        # It must ACCEPT the genesis-anchored proof and REJECT the non-genesis one — a verifier that
        # checked less would make a fabricated-anchor range MORE shareable, not less.
        run: |
          cargo build --release --manifest-path verifier/Cargo.toml
          B=verifier/target/release/hazync-verify
          echo "verifier size: $(stat -c%s "$B") bytes"
          # Assert EXACT exit codes, not merely "non-zero". A bare `if $B neg500; then fail; fi`
          # also passes when the binary segfaults, which is a check that cannot distinguish "correctly
          # refused" from "crashed" — the exact failure mode this suite exists to catch elsewhere.
          #   0 = verified and genesis-anchored
          #   1 = the proof is invalid (forged/tampered/corrupt/wrong guest)
          #   2 = the SNARK is valid but the range is not genesis-anchored
          # `cmd; rc=$?` does NOT work here: GitHub runs these under `bash -e`, so a non-zero exit
          # kills the step before rc is ever assigned. `|| rc=$?` is the form that survives set -e.
          rc=0; "$B" prover/testdata/snark/fold_8.snark || rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::verifier REJECTED the genesis-anchored proof (exit $rc)"; exit 1
          fi
          rc=0; "$B" prover/testdata/snark/neg500.snark >/dev/null 2>&1 || rc=$?
          if [ $rc -eq 0 ]; then
            echo "::error::verifier ACCEPTED a non-genesis range — the genesis pin is not enforced"; exit 1
          fi
          if [ $rc -ne 2 ]; then
            echo "::error::non-genesis range gave exit $rc, expected 2 — it was refused for the WRONG"
            echo "::error::reason (2 means 'valid SNARK, not anchored'; 1 means 'invalid proof')"; exit 1
          fi
          echo "verifier rejects the non-genesis range with the anchoring code ✓"
      - name: FFI verifier links from C++ and rejects what it must (#31)
        # ghostd will call THIS, not a C++ reimplementation of risc0 verification. Proves the static
        # library links from C++ and that every rejection path returns its own code — a caller that
        # adopted state on a non-zero return would be adopting a fabricated anchor.
        run: |
          cargo build --release --manifest-path verifier-ffi/Cargo.toml
          g++ -O2 -I verifier-ffi/include prover/testdata/ffi_smoke.cpp \
              verifier-ffi/target/release/libhazync_verify.a -lpthread -ldl -lm -o /tmp/ffi_smoke
          /tmp/ffi_smoke prover/testdata/snark/fold_8.snark 0   # genesis-anchored -> HAZYNC_OK
          /tmp/ffi_smoke prover/testdata/snark/neg500.snark   -5   # valid but NOT anchored
      - name: WASM verifier agrees with the CLI on every fixture (browsers are the copy nobody can audit)
        # The browser build is the copy most people will run and the one least inspectable after the
        # fact. It shares hazync_verify::verify with the CLI, so it cannot disagree "in principle" —
        # but that is exactly what was true of the RangeState mirrors before they drifted (#32).
        # Asserted against real proofs plus mutations that must be refused.
        run: |
          rustup target add wasm32-unknown-unknown
          ./verifier-wasm/build.sh
          ./verifier-wasm/test-parity.sh
      - name: SPEC.md formats match the code (a drifted spec is worse than no spec)
        # docs/SPEC.md is normative about byte layouts and constants. If it drifts, a reviewer
        # implements against it, their verifier disagrees with ours, and the disagreement looks like
        # OUR bug. Only mechanically checkable claims are covered — constants, tags, and the full
        # RangeState field list in declaration order, because the journal decodes positionally.
        run: ./scripts/check-spec.sh
      - name: Utreexo hash construction agrees across host, guest Rust and guest C++
        # Three implementations of the same hash. A drift means the host builds proofs the guest
        # cannot verify — and only for SOME blocks, because the domain tag only matters once a leaf
        # preimage length collides with an interior node's. Same failure shape as the RangeState
        # mirrors, so it gets a check rather than a comment saying "MUST stay byte-identical".
        run: ./scripts/check-utreexo.sh
      - name: Guest libc shims agree with glibc (they compile into the image, so they are consensus code)
        # cshims.c satisfies libc references pulled in by libstdc++/newlib when Core is compiled to
        # RISC-V. Nothing on the consensus path calls them (call sites resolved in hazync#55), but
        # they are IN the image, so a defect changes what a proof attests. Their semantics are plain
        # C, so unlike the rest of the guest they can be built for the host and differentially
        # tested against glibc without a zkVM. Carries positive controls against the previous
        # implementation — the version whose strtoul ignored its base and whose _sbrk checked only
        # the upper bound.
        run: ./prover/methods/guest/test-cshims.sh
      - name: RangeState mirrors agree (a reordered field MISREADS a valid proof, it does not reject it)
        run: ./scripts/check-rangestate.sh
      - name: Workflow YAML valid (a bad step name can silently break the whole run)
        run: ./scripts/check-workflows.sh
      - name: No workflow splices an expression into a shell block (arbitrary code where the signing key lives)
        # GitHub splices ${{ }} into the script before bash parses it, so a value with shell
        # metacharacters executes as code. release-sign.yml did this with the release tag while
        # holding GPG_PRIVATE_KEY and contents: write, and workflow_dispatch let any write-access
        # account supply that tag. Found by external review 2026-08-01; the gate exists so it cannot
        # come back one hurried `gh release upload` at a time.
        run: ./scripts/check-workflow-injection.sh
      - name: Versions agree (guest id + release refs across docs; a re-baseline must not leave a doc stale)
        run: ./scripts/check-versions.sh
      - name: Test surfaces are connected (no test that reports green while measuring nothing)
        run: ./scripts/check-test-surfaces.sh
      - name: Shellcheck (scripts run as root on the coordinator and as build tooling)
        # Caught a real one: check-test-surfaces.sh had an unguarded `cd`, so a failed cd would have
        # run every check against the wrong directory, found no test surfaces, and PASSED.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning $(git ls-files '*.sh')

  soundness-suite:
    # Full build (RISC0 toolchain + Core source + patches) then run regress + adversarial.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision (RISC0 toolchain, Bitcoin Core v28 source, patches, build)
        env:
          REPO_DIR: ${{ github.workspace }}
          # rzup authenticates its GitHub API calls with this, avoiding the anonymous
          # rate limit that otherwise flakes the toolchain install on shared CI runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./provision-vps.sh
      - name: Guest image id (METHOD_ID) — for reproducibility tracking
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host method-id
      - name: Block-170 consensus regression
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host regress
      - name: Adversarial soundness suite (every hole must REJECT)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host adversarial
      - name: Consensus reject-path negative tests (COV-1 time-too-old, COV-2 merkle CVE-2012-2459, SEC-2 forged accumulator inclusion)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && HAZYNC_HOST=./target/release/host ./ci_negative_tests.sh
      - name: BIP30 grandfathered overwrite (real block 91842)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host check-bip30
      - name: Retarget differential (carved real Core pow.cpp vs actual on-chain nBits at every mainnet retarget)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./retarget_diff_test.sh
      - name: Script-flag schedule differential (guest ⊇ Core, buried forks exact, exception blocks)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host script-flags-test
      - name: Bundle JSON round-trip (regression for the v0.9.0 spend-block parse bug, block 170)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          ./prover/target/release/host bundle-roundtrip-test
      - name: Chainparams anchor (Core's compiled consensus constants == canonical mainnet values)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./chainparams_check.sh
      - name: BIP68 relative-locktime matrix (real mainnet MTP, height and time based)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./test_bip68_locks.sh
      - name: BIP68 time-lock on a real mainnet transaction (and the pre-CSV non-enforcement control)
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.risc0/bin:$PATH" HAZYNC_BASE="$HOME/hazync-build"
          cd prover && ./test_bip68_real.sh

  dependency-audit:
    # Nothing was scanning dependencies for known advisories until now. This job fails on any NEW one.
    #
    # The three below are explicitly accepted rather than left to make the build permanently red — a
    # scanner that is always failing gets ignored, which is worse than no scanner. Each is re-checked
    # here every push, so if one becomes fixable (or a fourth appears) it surfaces immediately.
    #
    #   RUSTSEC-2025-0055  tracing-subscriber 0.2.25, ANSI escapes in logged user input. Reached only
    #                      via ark-relations -> risc0-groth16. The host's OWN subscriber is 0.3.23,
    #                      which is patched. Removing the 0.2.25 needs a risc0 bump, and risc0 versions
    #                      feed the guest image id — so it cannot be done without a METHOD_ID
    #                      re-baseline and a full board re-prove.
    #   RUSTSEC-2023-0071  rsa 0.9.10 Marvin timing sidechannel, via rzup (the toolchain installer).
    #                      Hazync performs no RSA private-key operations. NO upstream fix exists.
    #   RUSTSEC-2024-0388  derivative 2.2.0 unmaintained (not a vulnerability), same ark path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit every lockfile
        run: |
          IGNORE="--ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0388"
          rc=0
          # The verifier lockfiles were NOT audited, and they are the SHIPPED artifacts — the
          # standalone verifier, the C ABI ghostd links, and the browser build. All three pull
          # ark-bn254 -> ruint for Groth16 verification, so an advisory there lands directly in what
          # users run. Missed by the original list because they are not part of the prover workspace.
          for f in accumulator prover prover/methods/guest guest-pure-fuzz verifier verifier-ffi verifier-wasm; do
            echo "== $f =="
            cargo audit --file "$f/Cargo.lock" $IGNORE || rc=1
          done
          exit $rc

  reproducible-image-id:
    # Build the guest in the hermetic container (fixed paths) and assert its METHOD_ID equals the
    # published canonical id in reproduce/METHOD_ID. Fails on any drift — the reproducibility guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible container (guest at fixed paths)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=gh_token,env=GITHUB_TOKEN -t hazync-repro -f reproduce/Dockerfile .
      - name: Assert built METHOD_ID == canonical (reproduce/METHOD_ID)
        run: |
          BUILT=$(docker run --rm hazync-repro | grep -oE 'METHOD_ID [0-9a-f]{64}' | awk '{print $2}')
          CANON=$(grep -vE '^[[:space:]]*#' reproduce/METHOD_ID | grep -oE '[0-9a-f]{64}' | head -1)
          echo "built     = $BUILT"
          echo "canonical = $CANON"
          if [ -z "$BUILT" ] || [ "$BUILT" != "$CANON" ]; then
            echo "::error::guest METHOD_ID drifted from the canonical id — reproducibility broken"
            exit 1
          fi
          echo "reproducible METHOD_ID matches canonical ✓"
      - name: Groth16 SNARK verification + genesis-pin negative control (#23)
        # Runs HERE, not in soundness-suite, and the reason is not incidental: a RISC0 guest image id
        # absorbs the build's $HOME/.cargo paths, so the host that soundness-suite builds on the runner
        # ($HOME=/home/runner) has a NON-canonical METHOD_ID. The checked-in fixtures are pinned to the
        # canonical id, so only the fixed-path container build can verify them — this job is the one
        # place a canonical host exists. Putting the check in soundness-suite failed with an image-id
        # mismatch that looked like a broken proof and was actually a build-path mismatch.
        run: |
          docker run --rm hazync-repro sh -c \
            'cd /hazync-zkvm/prover && HAZYNC_HOST=/hazync-zkvm/prover/target/release/host ./ci_snark_verify.sh'
      - name: verify-any gate — the command the COORDINATOR runs on every submission
        # `host verify-any` is the sole gate between a submitted receipt and the board, and NOTHING in
        # CI ran it. The standalone verifier is well covered, but that is a different code path with a
        # different genesis condition — verify-any deliberately accepts valid MID-CHAIN ranges, which
        # is exactly what the covered path refuses.
        #
        # Here rather than in soundness-suite for the same reason as the step above: only the
        # fixed-path container has a canonical METHOD_ID, so only it can verify the checked-in
        # fixtures. A runner-built host rejects them as a build mismatch.
        run: |
          docker run --rm hazync-repro sh -c \
            'cd /hazync-zkvm/prover && HAZYNC_HOST=/hazync-zkvm/prover/target/release/host ./ci_verify_any.sh'
