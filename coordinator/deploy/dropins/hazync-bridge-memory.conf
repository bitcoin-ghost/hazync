[Service]
# After the sync, bitcoind's cache drops from 32 GiB to 4 GiB. The bridge gets that room: its memory
# tracks the UTXO set (~400-490 MiB per million coins measured), and it is stopped rather than allowed
# to starve bitcoind or the coordinator. It resumes from its checkpoint, re-walking at most 2,000 blocks.
MemoryHigh=40G
MemoryMax=44G
