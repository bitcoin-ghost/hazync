[Service]
# The bridge's working set tracks the UTXO set, so this caps it rather than letting it starve bitcoind
# or the coordinator. A kill is cheap BY DESIGN: it resumes from its checkpoint, re-walking at most
# HAZYNC_BRIDGE_CKPT blocks (2,000 live). MemoryHigh throttles, MemoryMax invokes the cgroup OOM killer
# — which kills inside this cgroup only, never bitcoind or the coordinator.
#
# ⛔ RAISED 2026-09-19 BECAUSE THE OLD CAP WAS SIZED FOR PRE-#355 CODE AND WAS KILLING A HEALTHY BRIDGE.
# The previous 40G/44G came with the comment "~400-490 MiB per million coins measured". #355 (inline
# forest-index position) cut that to 434 B/coin, #356 (streaming checkpoint save) removed a ~3.6 GiB
# save-time spike, and #357 (EMIT_FROM) removed the disk blocker — all merged 2026-09-16. The cap never
# moved. Measured on server 1 overnight 2026-09-18/19: the bridge pinned itself at MemoryMax=44G with
# ~99% memory pressure, and was OOM-killed 22 TIMES between 20:27:08 and 06:35:29 (journalctl, not
# dmesg -- dmesg is a ring buffer and showed only the last 2, which is how this was first undercounted).
# Restart=always with RestartUSec=10s and no effective start limit, so it thrashes indefinitely: one
# alert per kill, all night. It was being killed at 44 GiB for needing ~49.
#
# ⛔ AND IT MADE NO PROGRESS. Highest checkpoint ever reached is h=800,257 (01:24); the last three
# resumes were all FROM 800,257. Once hazync-bridge-backfill grew to ~21.5 GiB the bridge could no
# longer reach a 2,000-block checkpoint before hitting the cap, so each ~12-minute cycle reloads ~29 GiB
# of state, walks a few hundred blocks and dies. Every cycle is pure waste.
#
# The numbers, from hazync#350's analytic model against the MEASURED tip set of 165,212,120 coins
# (gettxoutsetinfo at h=967,273), not from extrapolation:
#
#     ~45.7 GiB steady  +  ~3.6 GiB load transient  =  ~49 GiB peak
#
# Corroborated live at 405 B/coin with 112.1M coins (model: 434). So MemoryHigh sits just above steady
# — the brake engages only above expectation, not in normal operation — and MemoryMax clears the peak
# with margin. Committed total 52 + bitcoind ~5.0 + coordinator ~0.8 = ~57.8 of 62.8 GiB.
#
# ⛔ DO NOT DEPLOY WHILE hazync-bridge-backfill IS RUNNING. It held ~12.2 GiB when this was written and
# ~22.3 GiB by 2026-09-19 16:00Z at h=660,000 — it GROWS with the walk, so the gap widens. That leaves only ~35 GiB
# free — less than this cap. After it finishes, ~57.0 GiB is free and this fits. Deploy order:
# backfill completes -> daemon-reload -> restart hazync-bridge.
#
# ⚠ bitcoind measures ~5.03 GiB, above the 4 GiB the old comment assumed, so the real margin is thinner
# than modelled. ⚠ The model is validated at 112M coins; the tip is 165M, so the first walk past ~120M
# is the real test. Watch for wchan=mem_cgroup_handle_over_high and flat CPU ticks, NOT unit state —
# systemd reports "active (running)" throughout a throttle freeze.
MemoryHigh=48G
MemoryMax=52G
