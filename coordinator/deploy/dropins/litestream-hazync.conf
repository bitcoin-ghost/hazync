# Live name: /etc/systemd/system/litestream.service.d/hazync.conf
#
# Litestream keeps a continuous copy of the coordinator ledger (coordinator.db) in Cloudflare R2, about a
# second behind. The Debian package's unit runs as root with no sandbox; this runs it as the same user as
# the coordinator, with write access only where the database lives (Litestream keeps its local state in
# /var/lib/hazync/.coordinator.db-litestream). Config: /etc/litestream.yml, root:hazync 0640, from
# coordinator/deploy/litestream.yml.example with the R2 keys filled in.
#
# Litestream 0.5 allows ONE replica per database, so the second copy of the ledger (Backblaze B2) comes
# from the nightly backup.sh snapshot, not from here.
[Unit]
Description=Litestream: continuous copy of the Hazync coordinator ledger to R2
After=network-online.target hazync-coordinator.service
Wants=network-online.target
[Service]
User=hazync
Group=hazync
RestartSec=10
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/hazync
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
