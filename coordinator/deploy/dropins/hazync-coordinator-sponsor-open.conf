# Sponsorship is open to the public.
#
# ⚠ THERE IS NO TEST MODE. SPONSOR_OPEN=1 opens /api/sponsor POST to everyone, not just to us; the
# route answers 503 "Sponsorship is not open yet." while it is 0. Anyone can then open an invoice and
# hold blocks against it.
#
# ⚠ An UNPAID hold is deliberately SOFT: an open invoice keeps its blocks from other sponsors, but
# submit() still accepts a proof of them from anyone, because an unpaid invoice is free to open and
# must not let a stranger lock provers out. SPONSOR_OPEN_INVOICES_PER_IP (default 3) bounds how many
# a single address may hold at once.
#
# ⚠ The PRICE is not set here. SPONSOR_PRICE_BANDS defaults to $1/block below 200,000 rising to
# $6/block above 1,000,000, and the dollar->sats conversion uses BTCPay's own store rate -- the same
# source that prices the invoice -- so a quote and its checkout cannot disagree.
#
# ⛔ AND THE GPUs ARE NOT PAID FOR BY THIS. A sponsor pays us in bitcoin; hazync-sponsor-bot rents
# RunPod pods in USD against our own account balance. The two are separate flows, and a sponsorship
# is only worth taking while the band beats what the pods cost. That comparison has never been
# measured -- `sponsor_bot.py trial` exists to measure it, and has never been run.
[Service]
Environment=SPONSOR_OPEN=1
