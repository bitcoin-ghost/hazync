[Service]
# Ship RECEIPTS offsite too, not just the ledger (hazync#49).
#
# Enabled 2026-08-02, deliberately right after the re-baseline: the store was 759 MB then, against
# 12 GB before it. The initial offsite sync only ever gets more expensive, so the cheapest moment to
# start is immediately after a reset — the same cost-curve argument that decided when to re-baseline.
#
# The mirror is append-only and namespaced by guest id (proofs-<id8>), so a future re-baseline cannot
# collide with, or silently skip, the retired baseline's receipts.
# ⛔ 0 ON SERVER 1, AND THE REASON IS NOT THE ONE YOU WOULD GUESS.
#
# This flag gates a block in backup.sh that mirrors $PROOFS to "$REMOTE/proofs-<id8>". **`BACKUP_REMOTE`
# is unset on server 1**, so that block is unreachable and the flag cannot fire at ANY value. The job
# says so itself on every run (2026-09-20):
#
#   [backup] wrote /srv/bulk/hazync/backups/20260920T031706Z (35G)
#   [backup] WARNING: BACKUP_REMOTE unset — this snapshot is on the SAME DISK as the data it backs up.
#
# So this line documents reality rather than changing behaviour. Declaring it 0 keeps a repo rebuild from
# quietly re-enabling a mirror nobody has reasoned about the day someone does set BACKUP_REMOTE.
#
# ⚠ THAT WARNING IS MISLEADING HERE. `BACKUP_DIR` is on /srv/bulk (vdb) while COORD_DB and COORD_PROOFS
# are on /var/lib (vda4) — different block devices. backup.sh cannot tell and warns unconditionally.
#
# Receipts ARE offsite, by a different route: `hazync-offsite-proofs{,-b2}` mirror them to R2 and B2 on
# their own timers, and those are the copies the prune job consults before deleting anything —
# `R2 confirms 166439 proof object(s)`, `B2 confirms 166983` (2026-09-20). This backup job is a LOCAL
# snapshot (35 GB, BACKUP_KEEP=2); it is not what gives receipts their off-box copy.
#
# ⚠ If BACKUP_REMOTE is ever set, revisit this deliberately rather than by inheritance: at that point 1
# would ship the whole receipt store to the backup remote as well, which may or may not be wanted
# alongside the offsite units.
Environment=BACKUP_REMOTE_PROOFS=0
