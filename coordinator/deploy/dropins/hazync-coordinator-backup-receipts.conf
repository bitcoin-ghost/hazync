[Service]
# Ship RECEIPTS offsite too, not just the ledger (hazync#49).
#
# Enabled 2026-08-02, deliberately right after the re-baseline: the store was 759 MB then, against
# 12 GB before it. The initial offsite sync only ever gets more expensive, so the cheapest moment to
# start is immediately after a reset — the same cost-curve argument that decided when to re-baseline.
#
# The mirror is append-only and namespaced by guest id (proofs-<id8>), so a future re-baseline cannot
# collide with, or silently skip, the retired baseline's receipts.
# ⛔ TURNED OFF ON THE BOX AND NOW DECLARED HERE, because the dedicated offsite units superseded it.
# `hazync-offsite-proofs{,-b2}` mirror the receipts to R2 and B2 on their own timers, content-named and
# append-only, and they are the copies the prune job actually consults before deleting anything:
#
#   [prune-caller] R2 confirms 166439 proof object(s)
#   [prune-caller] B2 confirms 166983 proof object(s)   (measured 2026-09-20)
#
# Leaving this at 1 makes the nightly backup re-ship the same receipts a third time, which is cost and
# runtime for no additional durability. The receipts ARE offsite — by a better route than this flag.
#
# ⚠ If those offsite units are ever retired, this must go back to 1 in the same change: the reasoning
# above is the ONLY thing keeping receipts covered.
Environment=BACKUP_REMOTE_PROOFS=0
