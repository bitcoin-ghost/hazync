[Service]
# Path migration off /root + drop to an unprivileged user (hazync#58), 2026-08-02.
# Loaded AFTER hardening.conf alphabetically, so it deliberately overrides ProtectSystem=full there.
# Nothing this service needs lives in /root any more, so ProtectHome=true is now safe — it was the
# bundle dir and the DB being under /root that made it unsafe (#60).
User=hazync
Group=hazync
WorkingDirectory=/opt/hazync/coordinator
Environment=COORD_DB=/var/lib/hazync/coordinator.db
Environment=COORD_STATE=/var/lib/hazync/coord_state
Environment=COORD_PROOFS=/var/lib/hazync/proofs
Environment=WITNESS_DIR=/var/lib/hazync/witnesses
Environment=HAZYNC_BRIDGE_OUT=/var/lib/hazync/bridge_bundles
Environment=HAZYNC_HOST=/usr/local/bin/hazync-host
ExecStart=
ExecStart=/usr/bin/python3 /opt/hazync/coordinator/server.py
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/hazync
# The spine is DATA and must not live in the checkout. It defaulted to <server.py dir>/spine, which
# ProtectSystem=strict makes read-only — so spine submission failed with EROFS. Latent since the
# hardening went in; surfaced when the re-baseline forced a fresh spine (hazync#58/#60 family).
Environment=COORD_SPINE=/var/lib/hazync/spine
