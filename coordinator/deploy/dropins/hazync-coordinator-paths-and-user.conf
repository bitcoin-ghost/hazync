[Service]
# Path migration off /root + drop to an unprivileged user (hazync#58), 2026-08-02.
# Loaded AFTER hardening.conf alphabetically, so it deliberately overrides ProtectSystem=full there.
# Nothing this service needs lives in /root any more, so ProtectHome=true is now safe — it was the
# bundle dir and the DB being under /root that made it unsafe (#60).
User=hazync
Group=hazync
WorkingDirectory=/opt/hazync/coordinator
Environment=COORD_DB=/var/lib/hazync/coordinator.db
Environment=COORD_STATE=/var/lib/hazync/coord_state
Environment=COORD_PROOFS=/var/lib/hazync/proofs
Environment=WITNESS_DIR=/var/lib/hazync/witnesses
# ⛔ THE BUNDLE STORE IS ON THE BLOCK DEVICE, NOT /var/lib. It was moved to /srv/bulk when server 1 was
# built with its 6 TB Local Block Storage, and this file was never updated — so for four days the repo
# named a path the coordinator does not use. It holds 418,269 bundles / 1.23 TB (measured 2026-09-20);
# /var/lib lives on the 2 TB root filesystem and could not take it.
#
# What made it worth fixing rather than leaving: the stale value is not inert. `/var/lib/hazync/bridge_bundles`
# still EXISTS on the box, empty, so anything that inherits this default finds a readable directory with
# nothing in it and concludes there is nothing there — which is exactly how the prune job reported
# "would delete 0 bundle(s)" against a full store. A rebuild from this repo would have pointed the
# coordinator itself at that empty directory and it would have served 404 for every bundle.
Environment=HAZYNC_BRIDGE_OUT=/srv/bulk/hazync/bridge_bundles
Environment=HAZYNC_HOST=/usr/local/bin/hazync-host
ExecStart=
ExecStart=/usr/bin/python3 /opt/hazync/coordinator/server.py
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/hazync
# ProtectSystem=strict makes everything outside ReadWritePaths read-only, and the bundle store now lives
# outside /var/lib. The coordinator only ever SERVES bundles, so read-only is the correct grant — the
# bridge owns that directory and is the only writer.
ReadOnlyPaths=/srv/bulk/hazync/bridge_bundles
# The spine is DATA and must not live in the checkout. It defaulted to <server.py dir>/spine, which
# ProtectSystem=strict makes read-only — so spine submission failed with EROFS. Latent since the
# hardening went in; surfaced when the re-baseline forced a fresh spine (hazync#58/#60 family).
Environment=COORD_SPINE=/var/lib/hazync/spine
