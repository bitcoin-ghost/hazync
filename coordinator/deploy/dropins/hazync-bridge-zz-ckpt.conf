[Service]
# Checkpoint every 200 blocks instead of 2,000 (the base unit's value), so a bridge that is killed
# before it can finish a checkpoint interval still ratchets forward instead of discarding the cycle.
#
# ⛔ WHY. Overnight 2026-09-18/19 the bridge was OOM-killed 23 times against MemoryMax=44G and made
# ZERO progress: highest checkpoint ever h=800,257 (01:24), and all 20 subsequent resumes were FROM
# 800,257. It needs 2,000 blocks to save anything and never got there, so every ~12-minute cycle —
# reloading ~29 GiB of state each time — was thrown away. At 200 it needs a tenth of that to bank
# progress. The root cause is the cap being below what the post-#355 code needs (see the companion
# cap-raise PR); this is the half that costs no memory and so can deploy while memory is still tight.
#
# ⚠ THE COST IS I/O, NOT RAM. state.bin is ~12.3 GB and this makes saves 10x more frequent, on a disk
# shared with bitcoind and the backfill walk. It is affordable only because #356 made the save STREAM
# (bincode::serialize_into over a BufWriter) instead of building the whole checkpoint as a Vec<u8> —
# before that, every save also spiked ~3.6 GiB of anon memory and this change would have been actively
# harmful. Do not revert #356 while this is set.
#
# ⚠ UNVERIFIED: whether the bridge walks 200 blocks per cycle at all. The state alone at 112.1M coins
# is ~42 GiB against the 44 GiB cap, so it may be reload-bound and never reach ANY interval. The logs
# cannot tell us — progress lines fire every 5,000 blocks and checkpoints every 2,000, so a cycle that
# walks 1 block and one that walks 4,741 look identical. The restart IS the experiment: if a checkpoint
# above 800,257 appears, it walks >=200; if not, only the cap raise helps and this changes nothing.
#
# Ordering: 'zz' so it lands after the base unit's Environment=HAZYNC_BRIDGE_CKPT=2000, same pattern as
# zz-emit-from.conf. Revert by deleting this file + daemon-reload.
Environment=HAZYNC_BRIDGE_CKPT=200
