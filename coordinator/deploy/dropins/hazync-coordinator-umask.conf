[Service]
# The ledger is not world-readable.
#
# `chmod 640 coordinator.db` alone does not hold: SQLite recreates `-wal` and `-shm` on checkpoints and on a
# restart, with the creating process's umask, so they came back 644 and the ledger was readable by every local
# user again. The umask is the part that lasts.
#
# Why it matters (#351): the sponsor bot runs on this box as its own user and is meant to have NO access to
# the coordinator's database — it asks the coordinator's API instead. Writers are unaffected: the coordinator
# and litestream both run as `hazync`, and the backup and integrity timers run as root.
#
# Live on server 1 since 2026-09-17, with `chmod 640` applied once to the existing files.
UMask=0027
