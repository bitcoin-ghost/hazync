# Claims must carry a signature from the key that owns them. Made on the box 2026-09-16 during the
# cutover, committed 2026-09-18 after the unit-drift check (#380) found it declared nowhere.
#
# ⛔ SECURITY-BEARING, AND IT FAILS OPEN. This is #310: without it the coordinator accepts unsigned
# claims, so a stolen key.hex is not needed to take someone's block. Rebuilding this box from the repo
# without this file turns signed claims OFF and nothing in any log says so.
[Service]
# #310, announced publicly 2026-09-16 04:46 UTC for tonight: /api/claim refuses an unsigned claim with
# 403. Workers have signed claims since v0.21.5; the fleet is v0.21.6. Verified from the live ledger
# before enabling: 4,696/4,696 claims signed in 24h, 143/143 since the cutover, all three active keys
# signing. The last unsigned claim was 2026-09-14 23:04 UTC. Unsigned workers can still SUBMIT — a
# claim is advisory-on-top and submit accepts any height — they simply cannot reserve a block.
Environment=CLAIM_REQUIRE_SIG=1
