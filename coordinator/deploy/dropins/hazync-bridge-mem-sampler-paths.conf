[Service]
# The tip-bridge box (hazync-coord, 152.53.93.164). These paths are NOT the ones on hazync-proof, and
# that is the whole reason they live in a drop-in:
#
#   hazync-proof  HAZYNC_BRIDGE_OUT=/srv/bulk/hazync/bridge_bundles   the HISTORY WALK, stopped at
#                                                                    bundle 418,268 on 2026-09-20
#   hazync-coord  HAZYNC_BRIDGE_OUT=/var/lib/hazync/tip_bundles       the TIP BRIDGE, live
#
# ⚠ WHAT THIS BOX'S SAMPLES ARE. The tip bridge starts at HAZYNC_BRIDGE_EMIT_FROM=967500 with the
# whole UTXO set already loaded, so its RSS is ONE POINT measured over and over — the check that the
# tip bridge stays under the MemoryHigh sized in #435 (62.3 G high / 64.4 G max, measured
# 2026-09-27). It is NOT the memory-vs-UTXO curve #350 needs; that only comes from a history walk,
# whose 494 real samples are the log on hazync-proof.
Environment=HAZYNC_SAMPLER_BUNDLE_DIR=/var/lib/hazync/tip_bundles
Environment=HAZYNC_SAMPLER_STATE_BIN=/var/lib/hazync/tip_bundles/state.bin
# 1,360 entries / 49 GB here, against ~1M entries / 1.2 TB on the history box, so the du pass is
# cheap on this one. Hourly all the same: nothing in these numbers moves in ten minutes.
Environment=HAZYNC_SAMPLER_DU_EVERY=6
