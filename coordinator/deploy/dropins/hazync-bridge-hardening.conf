[Service]
# Hardening, 2026-08-02 (audit M-1). Added as a DROP-IN rather than by replacing the unit: the live
# unit has drifted far from the repo copy (binary override, height cap), and overwriting it would
# have destroyed that operational history.
#
# NOT set, deliberately:
#   User=/Group=  — ExecStart, the datadir and the output dir are all under /root; dropping privilege
#                   needs a path migration first (hazync#58).
#   ProtectHome=  — /root must stay readable (binary + .bitcoin cookie) and /root/bridge_bundles
#                   writable. ProtectHome=true is exactly what makes the repo unit undeployable (#60).
#   ProtectSystem=strict — same reason: it would make /root/bridge_bundles read-only.
# ProtectSystem=full is used instead: /usr, /boot, /etc read-only, /root untouched.
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
