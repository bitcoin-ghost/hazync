[Service]
# ⛔ FOLLOW THE TIP EXACTLY (hazync#484). Sorts after the unit's own
# `Environment=HAZYNC_BRIDGE_FINALITY=100`, so this wins.
#
# The 100 was never a safety margin anybody chose on its merits — it is what you must do when the
# accumulator cannot go backwards. A resident forest with no rewind has exactly one defence against
# a reorg, and that is distance. The cost was a bridge permanently ~16 hours behind the chain it
# exists to follow, which makes "tip following" a name rather than a property.
#
# ⚠ 0 IS ONLY SAFE BECAUSE OF WHAT SHIPPED WITH IT. The binary now notices when the chain moves under
# the accumulator (a per-block head hash, checked against the node once per pass) and can put all
# four structures back (a per-block undo log, ~1.05 MB each, kept for HAZYNC_BRIDGE_UNDO_KEEP=288
# blocks — two days of chain). Setting this on a binary without those two would emit bundles that
# become wrong on the first 1-block reorg, with nothing to notice and nothing to recover to.
#
# ⚠ A fork deeper than the undo window HALTS the bridge rather than guessing. That is the correct
# failure: it stops, says what it would take, and leaves the state honest.
Environment=HAZYNC_BRIDGE_FINALITY=0
