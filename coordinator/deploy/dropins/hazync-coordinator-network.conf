# Per-box network settings, rescued out of the BASE unit (hazync#168 part B).
#
# These two lived only in /etc/systemd/system/hazync-coordinator.service, which is a hand-edited
# copy that also still carried pre-#58 /root paths. Replacing that base with the repo copy would
# have silently dropped them:
#
#   COORD_BIND   0.0.0.0 -> 127.0.0.1  (the coordinator would stop accepting the nginx proxy on
#                                       the web box, and the board would go dark on next restart)
#   TRUSTED_PROXIES        -> unset     (client IPs, and therefore rate limiting, would be wrong)
#
# They belong in a drop-in: per-box differences go in the unit environment, never in an edited
# copy of the shipped unit.
[Service]
Environment=COORD_BIND=0.0.0.0
Environment=TRUSTED_PROXIES=83.136.255.218
