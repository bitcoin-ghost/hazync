# Which proxy the coordinator trusts for client addresses, and who is exempt from rate limiting. Made on
# the box 2026-09-16 during the cutover, committed 2026-09-18 after the unit-drift check (#380) found it.
#
# ⛔ TRUSTED_PROXIES IS LOAD-BEARING. The coordinator sits behind nginx on the web box; without the right
# value here every request appears to come from the proxy, so rate limiting applies to the proxy rather
# than the caller. The 2026-08-25 incident that motivated the drift check was this exact setting being
# silently dropped by a unit rewrite.
[Service]
# 2026-09-16: bitcoinghost.org/hazync/api was removed from ghost-web (83.136.255.218) — it had no
# external users; workers moved to api.hazync.org on 15 Sep and the only remaining callers were our own
# watchdogs and the retired ghost board page. Only the web box (152.53.86.216) proxies now.
# Rollback note: restoring ghost-web's proxy needs this reverted AND the nft rule re-added.
Environment=TRUSTED_PROXIES=152.53.86.216
Environment=RATE_EXEMPT=152.53.86.216,127.0.0.1
