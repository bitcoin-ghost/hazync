# Live name: /etc/systemd/system/<unit>.service.d/alert.conf — push to a phone when this service
# fails OR crashes. Restart=always with RestartSec>=3 never reaches systemd's start limit, so the unit
# never enters `failed` and OnFailure= alone would stay silent through a crash loop. ExecStopPost=
# runs on every stop; hazync-alert.sh --crash sends only when SERVICE_RESULT != success (so a
# deliberate restart is quiet) and at most once per 15 min per unit. `+` runs it outside the sandbox.
[Unit]
OnFailure=hazync-alert@%n.service

[Service]
ExecStopPost=+/usr/local/bin/hazync-alert.sh --crash %n
