# BTCPay, for /api/donations and (when SPONSOR_OPEN=1) sponsor invoices.
#
# ⚠ The key file is the COORDINATOR key: cancreateinvoice + canviewinvoices + canviewstoresettings,
# scoped to the one store. It deliberately does NOT hold canmodifystoresettings, which is what BTCPay
# puts the wallet endpoints behind and which also authorises SPENDING. Nothing here can move funds.
#
# ⚠ Setting these makes /api/sponsor report `payments: true`. That is not the same as sponsorship
# being open -- SPONSOR_OPEN gates that separately, and the POST path refuses with 503 while it is 0.
#
# ⚠ Not the loopback pin the pay-watch script uses: that runs ON the BTCPay box, this does not.
[Service]
Environment=BTCPAY_URL=https://donate.hazync.org
Environment=BTCPAY_STORE_ID=9BhzGSgQgACvV3hXZJs3aLzqFQeqq5MxX58NDMyT7Xhw
Environment=BTCPAY_API_KEY_FILE=/etc/hazync/btcpay-api.key
