[Service]
# The sponsor bot API (#351): the coordinator reads the bot's ed25519 PUBLIC key from this file. Without it
# every /api/bot/ request is refused 503, which is the state of any box that has not enabled the bot.
#
# The file holds the output of `sponsor_bot.py bot-key`, run as the bot's own user; the private half stays in
# SPONSOR_BOT_HOME (mode 600) and never reaches the coordinator. The routes answer only a direct loopback
# connection with no X-Forwarded-For, so this key is not something a proxy can present.
#
# Live on server 1 since 2026-09-17.
Environment=SPONSOR_BOT_PUBKEY_FILE=/etc/hazync/sponsor-bot.pub
