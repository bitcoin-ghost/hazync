[Service]
# Path migration (hazync#58), 2026-08-02. The bridge still runs as ROOT and still needs /root
# readable: bitcoind runs as root with -datadir=/root/.bitcoin and its .cookie is 0600 root:root, so
# an unprivileged bridge cannot authenticate. ProtectHome=read-only is the most that can be done
# until bitcoind is given rpcauth credentials or its datadir moves.
Environment=HAZYNC_BRIDGE_OUT=/var/lib/hazync/bridge_bundles
ExecStart=
ExecStart=/usr/local/bin/hazync-host bridge
ProtectHome=read-only
ProtectSystem=strict
ReadWritePaths=/var/lib/hazync/bridge_bundles
