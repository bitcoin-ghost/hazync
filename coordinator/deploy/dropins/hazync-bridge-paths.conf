[Service]
# Path migration + drop to an unprivileged user (hazync#58), 2026-08-02.
#
# The blocker was never the bridge — it was bitcoind. bitcoind runs as root with
# -datadir=/root/.bitcoin and rewrites .cookie as 0600 root:root on every restart, so an
# unprivileged bridge could not authenticate.
#
# Solved by giving the bridge its OWN client-only datadir holding just rpcauth credentials
# (/var/lib/hazync/bitcoin-client, 0600 hazync). bitcoin-cli reads those and talks to the node over
# localhost RPC, so the bridge never touches /root at all — which is what makes ProtectHome=true
# possible here now.
User=hazync
Group=hazync
Environment=HAZYNC_BITCOIN_DATADIR=/var/lib/hazync/bitcoin-client
Environment=HAZYNC_BRIDGE_OUT=/var/lib/hazync/bridge_bundles
ExecStartPre=
ExecStartPre=/bin/bash -c "until bitcoin-cli -datadir=/var/lib/hazync/bitcoin-client getblockcount >/dev/null 2>&1; do sleep 5; done"
ExecStart=
ExecStart=/usr/local/bin/hazync-host bridge
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/hazync/bridge_bundles
