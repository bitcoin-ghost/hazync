[Service]
Environment=HZ_REPO=/opt/hazync
Environment=COORD_DB=/var/lib/hazync/coordinator.db
Environment=COORD_PROOFS=/var/lib/hazync/proofs
# ⛔ Backups go to the BLOCK DEVICE, for the same reason as the bundle store: /var/lib is on the 2 TB
# root filesystem alongside the ledger and the proofs this job is copying, so a local backup there is
# both the largest thing on that disk and the copy least able to survive it filling. /srv/bulk is the
# 6 TB device (3.77 TB free, 2026-09-20). Live on server 1 since the cutover; only the repo lagged.
Environment=BACKUP_DIR=/srv/bulk/hazync/backups
