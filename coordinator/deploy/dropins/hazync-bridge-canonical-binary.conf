# ⚠ DEAD CONFIG — committed to record what is on the box, not because it does anything.
#
# Drop-ins apply in lexical order, so this one runs FIRST and paths.conf runs LAST and wins:
#
#     canonical-binary.conf  ExecStart=/root/hazync-host-x86_64-linux-gnu bridge   <- superseded
#     paths.conf             ExecStart=/usr/local/bin/hazync-host bridge           <- effective
#
# Verified on the production coordinator: `systemctl show hazync-bridge -p ExecStart` reports
# /usr/local/bin/hazync-host. So this file changes nothing, while being named "canonical-binary"
# and pointing at a binary that is not the canonical one. That is the #168 disease in miniature.
#
# It is committed rather than deleted because removing live-looking config from a serving box is
# a separate decision with its own risk, and check-unit-drift.sh must not report drift for a file
# that genuinely exists. Delete it from the box and from here together, in one deliberate change.
[Service]
# The bridge PRODUCES the witnesses provers consume, so it must run the same canonical guest the
# coordinator verifies against and provers prove with. It was left on /root/host_new (guest 8553c4dd,
# pre-v0.9.0) through the v0.10.0 re-baseline, so from block 18311 it had emitted bundles in the old
# pre-"txs" format and every prover panicked on "missing field txs". Board stalled at 18310.
ExecStart=
ExecStart=/root/hazync-host-x86_64-linux-gnu bridge
