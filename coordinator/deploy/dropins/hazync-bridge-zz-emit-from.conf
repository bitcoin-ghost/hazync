[Service]
# 2026-09-16: point the BRIDGE ONLY at its own binary, built from main @ bffdbbf (#355 compact index,
# #356 streamed checkpoint save, #357 EMIT_FROM). Its guest id is 05a5a279, NOT the canonical
# 37987b85 — a RISC0 image id absorbs the build's absolute paths, so a canonical guest can only come
# from the fixed-path container build in reproduce/Dockerfile. That does not matter here: the bridge
# walks blocks and writes checkpoints, it never proves. The COORDINATOR keeps /usr/local/bin/hazync-host
# (canonical 37987b85) for HAZYNC_HOST verification — do not point it at this binary.
ExecStart=
ExecStart=/usr/local/bin/hazync-host-bridge bridge
# Walk to the tip writing NO bundles. At ~6.3 MB/block the emitting walk fills /srv/bulk in ~31 h;
# 967500 is above the chain tip, so nothing is emitted until it is tip-following. The board cannot
# reach these heights (max vranges hi 230,000; frontier 74,927) and bundles 1..418,268 stay on disk.
Environment=HAZYNC_BRIDGE_EMIT_FROM=967500
