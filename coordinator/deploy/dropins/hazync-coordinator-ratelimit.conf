[Service]
# Restore real limits (were 1000000 = limiter disabled) and exempt our own prover instead.
Environment=RATE_MAX=120
Environment=RATE_MAX_GET=600
#
# ⛔ An entry here is a rate-limit BYPASS. When the box behind an address is decommissioned the
# address goes back to the provider's pool, and the exemption then belongs to whoever is issued it
# next — which is exactly the anonymous GET flood on /api/state that §7 calls the cheapest
# board-takedown. Remove the entry when you remove the box; a prover is cattle, this list is not.
#
# 94.237.17.228 was dropped on 2026-09-08 (hazync#218). It was added 2026-07-27 as "our own prover",
# an UpCloud box in the same range as the retired hazync-b200 (94.237.18.83). By 2026-09-08 it was
# gone: 0 packets in 90s against the web box's 1,690, no connection on any port, and not among the
# GPU servers on the account. The matching iptables ACCEPT for :8899 was removed at the same time.
Environment=RATE_EXEMPT=83.136.255.218,127.0.0.1
