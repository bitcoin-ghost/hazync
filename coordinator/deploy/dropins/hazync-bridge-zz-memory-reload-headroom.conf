[Service]
# ⛔ 53G/57G CANNOT ABSORB A RELOAD. Measured 2026-09-22: restarting the bridge at height 879,457
# (state.bin 21.6 GB) peaked ~2 GiB above the running steady state, crossed MemoryHigh=53G, and the
# process sat in D state (mem_cgroup_handle_over_high) at 0% CPU with memory.pressure some=97.3% and
# the box at 0 GB available -- minutes from an OOM kill. It had run 44 hours happily at 0.48%
# pressure, because a long-running process never reloads.
#
# ⚠ STEADY STATE WAS NEVER THE PROBLEM. After the reload settled: RSS 47.9 GiB, pressure 0.00 --
# LOWER than the 50.9 GiB the 44-hour-old process held, because a fresh load is less fragmented. It
# is the RELOAD PEAK that needs headroom, and it grows with the UTXO set, so this needs revisiting
# as the walk continues.
#
# ⛔ REQUIRES SWAP. 60G here plus bitcoind (~3.2 GB) exceeds the 62 GB box. /swapfile-hazync (24G, in
# /etc/fstab) is what absorbs the peak -- it took 3 GB at the worst moment and released to 0 once the
# load finished. Do not remove the swap while these values stand, or the next restart wedges again.
#
# ⚠ The real answer is a bigger box: a 55+ GiB forest on 62 GB shared with bitcoind has no margin.
MemoryHigh=58G
MemoryMax=60G
