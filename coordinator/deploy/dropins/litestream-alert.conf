# Live name: /etc/systemd/system/litestream.service.d/alert.conf. Same wiring as hazync-coordinator-alert.conf:
# the package unit has Restart=always, which never reaches `failed`, so the crash hook is what speaks.
[Unit]
OnFailure=hazync-alert@%n.service
[Service]
ExecStopPost=+/usr/local/bin/hazync-alert.sh --crash %n
