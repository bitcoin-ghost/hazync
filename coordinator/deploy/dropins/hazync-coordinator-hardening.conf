[Service]
# Hardening, 2026-08-02 (audit M-1). A DROP-IN, not a unit replacement: the live unit has drifted far
# from the repo copy (every path under /root, COORD_BIND=0.0.0.0) and carries a ratelimit drop-in.
# Deploying coordinator/deploy/hazync-coordinator.service over it would have destroyed all of that
# AND broken witness serving, because that file pairs ProtectHome=true with a bundle dir in /root.
#
# NOT set, deliberately:
#   User=/Group=  — the DB, state dir and proof store are all under /root (hazync#58).
#   ProtectHome=  — /root must stay READ-WRITE: coordinator.db, coord_state and hazync-proofs all
#                   live there, and /root/bridge_bundles + /root/witnesses must be readable. This is
#                   precisely the conflict in hazync#60.
#   ProtectSystem=strict — same reason. ProtectSystem=full is used instead: /usr, /boot and /etc go
#                   read-only, /root is untouched.
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
