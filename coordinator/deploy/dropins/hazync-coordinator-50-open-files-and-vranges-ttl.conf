# Open-file limit and the /api/vranges cache TTL. Made on the box 2026-09-16 during the cutover and
# committed 2026-09-18, when the unit-drift check (#380) was first run and found it declared nowhere.
#
# ⛔ BOTH SETTINGS ARE THE #300 FIX. /api/vranges stampeded, fds hit the 1024 default, and the board was
# down ~21 minutes. Rebuilding this box from the repo without these restores the default limit and the
# uncached endpoint -- that is, it restores the outage.
[Service]
LimitNOFILE=65536
Environment=VRANGES_CACHE_TTL=120
