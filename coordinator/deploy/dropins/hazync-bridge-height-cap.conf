# Emergency cap, 2026-07-30. The accumulator fix took the bridge from 291 to 77,600 blocks/hr, and
# bundle size grows steeply with era (14.5 KB at h=100k, 4.6 MB at h=194k). At that combination the
# bridge consumes ~72 GB/hr and would have filled /root in ~10 hours, taking the coordinator, the
# proofs and bitcoind down with it.
#
# The runway does not need to be large: the PROVING frontier is 39,299. Capping at 220,000 still
# leaves ~180,000 blocks of witnesses ahead of the provers, which is months of work at any plausible
# fleet size. Raise this deliberately, alongside a retention policy — not by default.
[Service]
Environment=HAZYNC_BRIDGE_TO=220000
