# Where the bot looks for the artefacts a pod needs, so has_bundle() can see them.
#
# ⛔ WITHOUT THIS THE BOT PROVES NOTHING, EVER, AND SAYS SO POLITELY. has_bundle() checks
# $HAZYNC_BRIDGE_OUT/bundle_<h>.json and $WITNESS_DIR/block_<h>.json. Unset, BRIDGE_DIR is empty and
# skipped and WITNESS falls back to <sponsor_bot.py's dir>/witnesses -- /opt/hazync/coordinator/
# witnesses, which nothing populates. Every held block then reports
#
#     N more block(s) wait for bundles: no pod can prove them until the bridge builds them
#
# Measured 2026-09-26 on the first real sponsorship: bundle_196001.json was present, 2,715,281 bytes,
# and the coordinator served /api/witness/196001 with 200 -- while the bot called the same block
# unprovable. A sponsor had paid.
#
# ⚠ THE VALUES ARE THE COORDINATOR'S. hazync-coordinator.service has carried HAZYNC_BRIDGE_OUT and
# WITNESS_DIR all along; the bot's unit never got them, so the same two paths are configured twice on
# one box and drifted the moment one was set. The better fix is for the bot to ASK the coordinator
# (its own docstring says "True when the coordinator can serve block h to a worker", which is a
# question the coordinator can answer and the filesystem only approximates). Until then, keep these
# in step with hazync-coordinator.service.d/paths-and-user.conf.
[Service]
Environment=HAZYNC_BRIDGE_OUT=/srv/bulk/hazync/bridge_bundles
Environment=WITNESS_DIR=/var/lib/hazync/witnesses
