[workspace]
resolver = "2"
members = ["host", "methods"]

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

[patch.crates-io]
risc0-zkvm = { path = "../vendor/risc0-zkvm" }
# hazync#119: vendored so preflight can be instrumented. Witness generation is the ONLY code the
# CPU and CUDA backends share, and both emit a byte-identical invalid seal, so the fault is here.
risc0-circuit-rv32im = { path = "../vendor/risc0-circuit-rv32im" }
# hazync#119: vendored to add an env-gated scan of the check polynomial. The upstream
# `circuit_debug` feature cannot be used -- it does not compile in 3.0.5 and it changes the
# verifier's protocol (reads the DEEP point instead of deriving it).
risc0-zkp = { path = "../vendor/risc0-zkp" }
# hazync#119: vendored for the FIX. Phase 3 of the accum pass (cxx/ffi.cpp, cuda/ffi.cu) adds
# prev[k] to LogUp cells the instruction arm never wrote, which still hold INVALID; with prev[k] == 0
# that yields 0x87FFFFFE >= P and one corrupted butterfly pair. See patches/0119-fix-accum-invalid.patch.
risc0-circuit-rv32im-sys = { path = "../vendor/risc0-circuit-rv32im-sys" }
